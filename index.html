/* ───────────────────────── 9. GAPS & FUTURE ───────────────────────── */
{t:"Gaps and the future", c:[
{t:"Gap 1: understudied cities", h:`
<p>Research is skewed toward <b>well-instrumented, affluent</b> cities in <b>Af</b> climates: Singapore and Kuala Lumpur. That limits how well the findings generalise.</p>
<p><b>Under-represented:</b></p>
<ul>
<li><b>Small and mid-sized</b> cities</li>
<li>Cities in <b>Aw</b> (savannah) and <b>Am</b> (monsoon) climates</li>
<li>West Africa, parts of India, coastal Latin America</li>
<li>Small island states</li>
</ul>
<p>This matters even though <b>Aw is the most widespread</b> tropical climate by land area.</p>
<div class="key">Expanding to Aw and Am regions is a matter of <b>spatial equity</b> and of <b>scientific accuracy</b>.</div>`},
{t:"Af vs Aw vs Am: they behave differently", h:`
<div class="tw"><table>
<tr><th>Climate</th><th>UHI behaviour</th></tr>
<tr><td><b>Aw</b> (savannah)</td><td>Intense <b>dry seasons</b> bring strong <b>daytime surface heating</b> and pronounced <b>night-time UHI peaks</b>. Worst in <b>low-rise, sprawling</b> cities with little vegetation.</td></tr>
<tr><td><b>Af</b> (rainforest)</td><td>A more <b>stable</b> daily temperature range. Heat stress is amplified by <b>constant high humidity</b> and <b>weak night ventilation</b> (low wind, dense buildings).</td></tr>
<tr><td><b>Am</b> (monsoon)</td><td>In between. Monsoon rain <b>reduces</b> UHI in wet months. UHI <b>intensifies</b> in dry periods, when evapotranspiration is suppressed.</td></tr>
</table></div>
<p>Lumping all tropical cities together risks mitigation that is <b>ineffective or even counterproductive</b>.</p>`},
{t:"Gap 2: tailor field methods to the climate", h:`
<ul>
<li><b>Af cities:</b> humidity rarely drops <b>below 70%</b>, and vegetation persists all year.
<ul>
<li>Surface temperatures alone <b>underestimate</b> human heat exposure.</li>
<li>So use radiation- and humidity-sensitive indices such as <b>UTCI</b> or <b>PET</b>.</li>
</ul></li>
<li><b>Aw cities:</b> surfaces <b>dry rapidly</b> in the dry season, so the ground stores more heat and urban–rural contrasts are stronger.
<ul>
<li>Fixed stations capture strong daily and seasonal swings.</li>
<li>But they may <b>miss micro-variation</b> in <b>informal settlements</b>.</li>
</ul></li>
<li><b>Am cities</b> (coastal India, SE Asia): must account for <b>shifting winds</b> and <b>seasonal albedo changes</b> from monsoon rain. Very few studies do.</li>
</ul>
<div class="key">Combine <b>fixed + mobile</b> measurements, deployed across Af, Am, As and Aw, for both time depth and spatial detail.</div>`},
{t:"Gap 3: measure more than air temperature", h:`
<ul>
<li>Most studies focus on <b>air temperature</b> only. They neglect humidity, wind, radiation and MRT.</li>
<li>With tropical humidity and sun, temperature alone <b>fails</b> to show the full heat stress.</li>
<li>Note the <b>timing mismatch</b>:
<ul>
<li>UHI is often strongest at <b>night</b>.</li>
<li><b>Outdoor discomfort</b> peaks during the <b>day</b>, with high temperatures and strong sun.</li>
</ul></li>
<li>Studies rarely measure all key parameters <b>at the same time</b>.</li>
</ul>
<p><b>Recommendation:</b> a <b>holistic</b> approach using MRT, PET, UTCI, or <b>OTCA (Outdoor Thermal Comfort Autonomy)</b>, which supports climate-responsive design evaluation. This has worked in <b>Singapore</b> high-rise settings.</p>`},
{t:"Cheaper, wider data", h:`
<ul>
<li><b>Low-cost sensor networks</b> can overcome money limits, but they are <b>underused</b> in the tropics.</li>
<li><b>Standardise methods</b> so that data from different regions can be compared.</li>
<li><b>Wearable</b> and <b>low-cost</b> tech, such as miniaturised loggers and personal microclimate trackers:
<ul>
<li>They suit under-represented areas like <b>tropical Africa</b> and <b>small islands</b>.</li>
<li>They measure <b>individual exposure</b>.</li>
<li>They support <b>mobile transects</b> with real-time, high-frequency data.</li>
<li>They need little infrastructure.</li>
</ul></li>
<li><b>Citizen science</b> or community monitoring can <b>democratise</b> data collection and boost public engagement.</li>
</ul>`},
{t:"The AC paradox", h:`
<p><b>Air conditioning</b> is the dominant way tropical cities cool buildings. But AC <b>dumps waste heat outside</b>, which makes the UHI worse. People then need even more AC.</p>
<div class="eq">hotter city → more AC → more waste heat → hotter city</div>
<p>This is a <b>self-reinforcing feedback loop</b>.</p>
<ul>
<li>Few reviewed studies explicitly measured AH contributions.</li>
<li>Reliance on AC and motor transport is growing, so AH needs measuring across many settings.</li>
<li>AH should be <b>built into UHI models</b>.</li>
</ul>`},
{t:"Gap 4: models need tropical calibration", h:`
<ul>
<li>Most tools, such as <b>Envi-met</b>, were calibrated for <b>temperate</b> climates and miss tropical heat and moisture dynamics.
<ul>
<li><b>Af:</b> high humidity and constant evapotranspiration are <b>under-represented</b>.</li>
<li><b>Aw / Am:</b> models struggle with the <b>seasonality</b> of surface heat fluxes and <b>soil moisture</b>.</li>
</ul></li>
<li>Tropical models such as <b>t-TEB</b> exist but are <b>rarely used</b>, usually in a single city.</li>
<li><b>Large-scale experimental validation</b> in the tropics is lacking, especially under extreme sun, convection and AH.</li>
<li><b>Recommendation:</b> calibrate systematically against field data, <b>for each subtype</b> (Af, Aw, Am).</li>
</ul>
<h3>AI and hybrid models</h3>
<ul>
<li>AI and ML models are also mostly adapted to <b>temperate</b> climates. They struggle with <b>reduced night cooling due to low wind</b>.</li>
<li>They should be trained on <b>tropical datasets</b>.</li>
<li><b>Hybrid</b> AI + numerical models are promising, but they need <b>high-quality, standardised data</b>.</li>
<li><b>Southeast Asia:</b> UHI could raise urban temperatures by up to <b>4 °C by 2050</b>.</li>
</ul>`},
{t:"Gap 5: the scale problem", h:`
<p>Most studies are <b>broad-scale</b>: city-wide or regional, using satellites or a few urban–rural stations. These miss the large <b>micro-variation</b> inside tropical cities.</p>
<h3>Satellite limits</h3>
<ul>
<li>Satellites capture short-term <b>daily (diurnal) changes</b> poorly, yet clouds and heat shift fast in the tropics.</li>
<li>Satellite <b>surface</b> temperature ≠ what a <b>pedestrian</b> feels, especially in informal settlements or green zones.</li>
</ul>
<h3>Fix: multi-scale</h3>
<p>Combine:</p>
<ul>
<li>remote sensing</li>
<li>fine-resolution in situ air temperature</li>
<li>CFD and microclimate models</li>
</ul>
<p>This matters because <b>local</b> effects are big in the tropics: evapotranspiration, AH, low wind.</p>
<p>Neighbourhood studies are <b>very limited</b>. For example, only <b>7</b> used mobile measurements.</p>`},
{t:"Africa, informal settlements and early warning", h:`
<ul>
<li><b>African Aw cities:</b> fast, unplanned growth, but research is mostly <b>coarse remote sensing</b>.</li>
<li>There is little detail on <b>dense, informal or peripheral</b> neighbourhoods, which are the <b>most heat-vulnerable</b>.</li>
<li>That blocks <b>equitable</b> cooling strategies.</li>
<li>The paper suggests filling this with mobile transects, sensor networks, CFD and <b>participatory sensing</b>.</li>
</ul>
<h3>More recommendations</h3>
<ul>
<li>Add <b>socio-economic variables</b> and local morphology to analyses.</li>
<li>Use high-res satellites, ML and <b>urban digital twins</b> (virtual copies of cities) to find vulnerable zones.</li>
<li>Prioritise <b>fine-scale Early Warning Systems (EWS)</b>.
<ul>
<li>Most studies look at long-term patterns. Few do <b>short-term forecasting</b>.</li>
<li>Neighbourhood-scale EWS with thermal and health data would let authorities send <b>timely alerts</b> and deploy cooling.</li>
<li>Especially for informal settlements and areas with low green cover.</li>
</ul></li>
</ul>`},
{t:"The three approaches complement each other", h:`
<div class="tw"><table>
<tr><th>Approach</th><th>Strength</th><th>Weakness</th></tr>
<tr><td><b>Ground stations</b> (fixed + mobile)</td><td>High <b>time</b> detail; direct air temperature and comfort</td><td>Few points</td></tr>
<tr><td><b>Remote sensing</b></td><td>Broad <b>spatial</b> coverage; long-term LST and land cover</td><td>Doesn't capture <b>human thermal perception</b></td></tr>
<tr><td><b>Numerical models</b></td><td>The <b>bridge</b>: simulate processes, test mitigation scenarios</td><td>Cross-scale mismatches</td></tr>
</table></div>
<p><b>How they connect:</b></p>
<ul>
<li>LST data can feed urban canopy models.</li>
<li>In situ air temperature is needed to <b>validate</b> models.</li>
</ul>
<p><b>Cross-scale limits:</b></p>
<ul>
<li><b>Mesoscale</b> models miss fine morphology and vertical layering.</li>
<li><b>Microscale</b> models lack accurate starting conditions and local parameters.</li>
</ul>
<div class="key">Integrate <b>field + satellite + models</b>. Combined, they are a powerful, complementary toolkit.</div>`},
{t:"Conclusion", h:`
<ul>
<li><b>Solar radiation and humidity</b> shape tropical urban climate, not just urbanisation.</li>
<li>Some studies now combine <b>UHI + outdoor thermal comfort</b>. This should spread to all studies.</li>
<li><b>Future research should:</b>
<ul>
<li>do <b>multi-parameter</b> analyses</li>
<li>refine models to capture <b>AC</b> waste heat, <b>limited night cooling</b>, <b>evapotranspiration under high humidity</b>, and <b>convective rainfall</b></li>
</ul></li>
<li><b>Don't lump</b> Af, Am and Aw together. Each has its own rainfall, cloud and evapotranspiration pattern.</li>
<li>Temperate models and solutions may not transfer, because <b>solar angles, vegetation responses and building ventilation</b> differ.</li>
<li>Study <b>small and mid-sized cities</b>, especially in <b>Aw</b>.</li>
<li><b>Bridge</b> large-scale remote sensing with local interventions using multi-scale methods.</li>
<li>Get <b>researchers, urban planners and policymakers</b> to collaborate.</li>
</ul>
<div class="key">The goal: tropical cities, growing fast and highly vulnerable, must stay <b>liveable</b> as temperatures rise.</div>`},
{t:"Quiz: Gaps and the future", q:[
["Which tropical cities are most over-represented in UHI research?", ["Small Aw cities in Africa","Affluent, well-instrumented Af cities like Singapore and Kuala Lumpur","Small island states","Am coastal cities"], 1, "Af hubs dominate; Aw, Am and smaller cities are under-represented."],
["In which climate does monsoon rain reduce UHI in wet months but intensify it in dry periods?", ["Af","Aw","Am","As"], 2, "Am sits between Af and Aw."],
["Why do surface temperatures alone underestimate heat exposure in Af cities?", ["Humidity rarely drops below 70%, so radiation- and humidity-sensitive indices like UTCI/PET are needed","Satellites can't see Af cities","Af cities are cold","There is no sun"], 0, "High humidity shapes how heat is felt."],
["What is the 'AC paradox'?", ["AC is too expensive","AC cools indoors but dumps waste heat outside, worsening UHI and creating a feedback loop","AC doesn't work in humidity","AC only works at night"], 1, "A self-reinforcing loop."],
["UHI could raise urban temperatures in Southeast Asia by up to how much by 2050?", ["1 °C","2 °C","4 °C","10 °C"], 2, "Up to 4 °C."],
["Which index do the authors recommend alongside MRT, PET and UTCI?", ["NDVI","OTCA (Outdoor Thermal Comfort Autonomy)","GDP","LST"], 1, "OTCA supports climate-responsive design evaluation."],
["A key weakness of satellite surface temperature is that it…", ["Is too detailed","Doesn't match what pedestrians feel, and misses short-term daily changes","Is always wrong","Only works at night"], 1, "LST ≠ human exposure; poor at diurnal variability."],
["The authors want fine-scale Early Warning Systems mainly to…", ["Predict rainfall","Issue timely alerts and deploy cooling for vulnerable people, e.g. in informal settlements","Replace satellites","Measure GDP"], 1, "Short-term forecasting is under-studied."],
["Which role do numerical models play among the three approaches?", ["They replace field data","They are a bridge: simulating processes and testing mitigation, using LST inputs and in situ validation","They only make maps","They measure humidity"], 1, "Models link ground and satellite data."],
["Why might temperate UHI tools and solutions not transfer to the tropics?", ["Different languages","Solar angles, vegetation responses and building ventilation practices differ","Tropical cities have no buildings","They are too cheap"], 1, "Stated in the conclusion."]
]}
]},

/* ───────────────────────── 10. CHEATSHEET ───────────────────────── */
{t:"Cheatsheet", c:[
{t:"Cheatsheet 1: the big picture", h:`
<div class="tw"><table>
<tr><th>Item</th><th>Key fact</th></tr>
<tr><td>Paper</td><td>Lefevre, Malet-Damour, Boyer, Rivière (2025). PIMENT Lab, Univ. of Reunion Island. <i>City and Environment Interactions</i> 28</td></tr>
<tr><td>Type</td><td>Systematic review (PRISMA) of tropical UHI studies</td></tr>
<tr><td>Question</td><td>How is UHI specifically addressed in tropical regions?</td></tr>
<tr><td>UHI</td><td>Positive temperature difference, urban − rural</td></tr>
<tr><td>History</td><td>Howard 1833 London (2 °C); Schmidt 1927 Vienna (first car transect)</td></tr>
<tr><td>Oke's causes</td><td>Morphology (less ventilation); mineral surfaces replace vegetation; anthropogenic heat</td></tr>
<tr><td>Tropical</td><td>Köppen A; every month &gt;18 °C; ~19% of land (3rd largest); 23.5° N–S</td></tr>
<tr><td>Subtypes</td><td>Af rainforest (&gt;60 mm every month); Am monsoon; Aw savannah (most widespread, ~11.5% of land); As dry summer</td></tr>
<tr><td>Tropical vs temperate</td><td>Temperate: night peak, can be negative by day. Tropical: lasts all day, daytime peaks in the wet season</td></tr>
<tr><td>Growth</td><td>Organic, unregulated sprawl. IPCC: &gt;90% of population growth in low latitudes</td></tr>
<tr><td>Four UHI types</td><td>SUHI (satellite LST, most common); atmospheric/canopy (in situ air); UBL-UHI (vertical); SSUHI (underground)</td></tr>
</table></div>`},

{t:"Cheatsheet 3: methods and tools", h:`
<div class="tw"><table>
<tr><th>Method</th><th>Plus</th><th>Minus</th></tr>
<tr><td><b>Mobile transect</b></td><td>Fine spatial detail, cheap, flexible</td><td>Snapshots only; night bias; often intra-urban, not true UHI</td></tr>
<tr><td><b>Fixed stations</b></td><td>Continuous, long-term, seasonal; test mitigation</td><td>Costly; few points</td></tr>
<tr><td><b>Landsat</b></td><td>High resolution</td><td>16-day revisit; clouds</td></tr>
<tr><td><b>MODIS</b></td><td>Daily; regional and seasonal</td><td>~1 km, coarse</td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Tool</th><th>Remember it as</th></tr>
<tr><td><b>WRF</b></td><td>NCAR; city/mesoscale; #1 tool; UCMs SLUCM / BEP (MLUCM) / BEP+BEM; Noah LSM</td></tr>
<tr><td><b>UWG</b></td><td>Duran, Ecuador; informal settlements; cooling energy +30–70%</td></tr>
<tr><td><b>ADMS-Urban</b></td><td>Kuala Lumpur; comfort + energy by land use; humidity and pollution</td></tr>
<tr><td><b>t-TEB</b></td><td>Karam; tropical TEB; free convection + drainage; Rio 2007</td></tr>
<tr><td><b>Envi-met</b></td><td>Bruse &amp; Fleer; 3-D CFD; Navier–Stokes; #1 CFD tool (14); temperate-built</td></tr>
<tr><td><b>STEVE</b></td><td>Empirical, Singapore data; 50 m; more realistic than Envi-met</td></tr>
<tr><td><b>Fluent / OpenFOAM / CRADLE</b></td><td>Porosity and AH removal / vegetation raises humidity / office ventilation</td></tr>
<tr><td><b>Rayman</b></td><td>MRT and PET; courtyards; Sky View Factor</td></tr>
<tr><td><b>DART</b></td><td>3-D radiation; leaf area density (Singapore)</td></tr>
<tr><td><b>EnergyPlus</b></td><td>Building energy; cool roofs beat green roofs in Singapore</td></tr>
<tr><td><b>Regression</b></td><td>Cheap, adaptable; 2nd most used</td></tr>
<tr><td><b>ML (4 studies)</b></td><td>Random Forest (Nagpur); GWR + DNN (HK, Singapore); Genetic Algorithm (Sanya); RS + ML (Colombia)</td></tr>
</table></div>
<p><b>Comfort indices:</b> PET (Höppe), UTCI (Jendritzky), SET, THI, Humidex, TDI (Thom). MRT feeds PET.</p>`},
{t:"Cheatsheet 4: solutions and gaps", h:`
<div class="tw"><table>
<tr><th>Family</th><th>Mechanism</th><th>Watch out</th></tr>
<tr><td><b>Green</b></td><td>Shade + evapotranspiration; year-round in Af; cheap to maintain</td><td>Stomata close in heat/drought; dense canopies trap night heat and add humidity; standalone trees weak; dry Aw/As need irrigation</td></tr>
<tr><td><b>Blue</b></td><td>Evaporation: sensible → latent heat</td><td>Can warm locally in mornings/evenings (Putrajaya); vegetation cooled more</td></tr>
<tr><td><b>Gray</b></td><td>High albedo, less heat storage, more evaporation</td><td>Must survive sun, rain and moisture</td></tr>
<tr><td><b>Cut AH</b></td><td>Public transport, EVs, insulation, smarter AC</td><td>Often overlooked; the AC feedback loop</td></tr>
</table></div>
<p>Green + Blue = <b>Nature-Based Solutions</b>.</p>
<h3>Research gaps and recommendations</h3>
<ol>
<li>Study <b>Aw / Am</b>, <b>small and mid-sized</b> cities, <b>Africa</b>, islands. Don't lump subtypes together.</li>
<li><b>Tailor</b> field methods to each subtype. Combine <b>fixed + mobile</b>.</li>
<li><b>Holistic, multi-parameter</b> measurement (MRT, PET, UTCI, OTCA). Remember: <b>day</b> discomfort vs <b>night</b> UHI.</li>
<li><b>Low-cost and wearable</b> sensors, standard methods, citizen science.</li>
<li>Quantify <b>anthropogenic heat</b>, especially <b>AC</b>.</li>
<li><b>Calibrate models</b> per subtype; train AI on tropical data; hybrid models need good data.</li>
<li><b>Multi-scale:</b> combine satellite + in situ + CFD. More <b>neighbourhood</b> studies, especially in <b>informal settlements</b>.</li>
<li>Add <b>socio-economic</b> variables, <b>digital twins</b>, fine-scale <b>Early Warning Systems</b>.</li>
<li><b>Interdisciplinary</b> collaboration: researchers, planners, policymakers.</li>
</ol>`},
{t:"Cheatsheet 5: likely traps", h:`
<ul>
<li><b>11.5% twice:</b> Am = 11.5% of studies; Aw = ~11.5% of global land.</li>
<li><b>Af dominates studies</b> (because of Singapore). <b>Aw dominates land</b>.</li>
<li><b>Period:</b> the abstract says 2000–2024, but the search covered "all periods up to July 2024", and Fig 5 starts in 1987.</li>
<li><b>WRF count:</b> 20 in the text vs 18 in Fig 8.</li>
<li><b>SUHI ≠ canopy UHI:</b> satellite surface vs ground-level air.</li>
<li><b>Seasonality is mixed:</b>
<ul>
<li>Night UHI is often strongest in the <b>dry</b> season (Lagos, Akure; Aw).</li>
<li>Some <b>surface</b> UHIs peak in the <b>rainy</b> season (Presidente Prudente SUHI, humid Chinese cities).</li>
<li>Singapore (Af) peaks with the <b>monsoon</b>.</li>
</ul></li>
<li><b>Vegetation vs cool roofs:</b>
<ul>
<li>Chatterjee: vegetation beats cool roofs in the tropics.</li>
<li>Yang (EnergyPlus, Singapore): cool roofs beat green roofs (no added moisture).</li>
<li>Kotharkar: cool roofs work better at <b>high</b> density.</li>
</ul></li>
<li><b>Greening can backfire:</b> Setiawati (+3.1 °C UTCI in Medan/Denpasar); OpenFOAM (more humidity, less wind); dense canopies at night.</li>
<li><b>Water can backfire:</b> Putrajaya water bodies warmed mornings and evenings.</li>
<li><b>Envi-met</b> is the most popular CFD tool but temperate-built: it under-predicts by 2–3 °C vs STEVE.</li>
<li><b>Standalone trees</b> have minimal effect. <b>Spread-out street trees</b> beat one big green area (Nagpur). Optimal park size is 0.37–0.77 ha.</li>
<li><b>Kampala:</b> urban land doubled, yet SUHI fell (green spaces).</li>
</ul>`}
]},

// flatten
var flat = [];
M.forEach(function(m, mi){ m.c.forEach(function(c, ci){ flat.push({mi:mi, ci:ci}); }); });
var cur = 0;
try { var s = parseInt(location.hash.slice(1) || localStorage.getItem("uhi-pos"), 10); if (s >= 0 && s < flat.length) cur = s; } catch(e){}

var $ = function(id){ return document.getElementById(id); };
var nav = $("nav"), list = $("navlist"), card = $("card");

// options are shuffled on every render so the answer position can't be memorised
function quiz(q){
  return q.map(function(x, i){
    var order = x[1].map(function(_, j){ return j; });
    for (var k = order.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), t = order[k]; order[k] = order[r]; order[r] = t; }
    return '<div class="mcq" data-a="'+order.indexOf(x[2])+'"><p class="qq"><span>'+(i+1)+'.</span>'+x[0]+'</p><div class="opts">'+
      order.map(function(o, j){ return '<button data-j="'+j+'">'+"ABCD"[j]+'. '+x[1][o]+'</button>'; }).join("")+
      '</div><p class="why">'+x[3]+'</p></div>';
  }).join("") + '<div class="score" id="score"></div>';
}

function score(){
  var el = $("score"); if (!el) return;
  var n = card.querySelectorAll(".mcq").length, d = card.querySelectorAll(".mcq.done").length, ok = card.querySelectorAll(".mcq.ok").length;
  el.innerHTML = '<span>Answered <b>'+d+' / '+n+'</b> · Correct <b>'+ok+'</b></span>' + (d ? '<button id="retry">Retry</button>' : '');
}

card.addEventListener("click", function(e){
  if (e.target.id === "retry") { go(cur); return; }
  var b = e.target.closest(".opts button"); if (!b) return;
  var m = b.closest(".mcq"); if (m.classList.contains("done")) return;
  var a = +m.dataset.a, j = +b.dataset.j;
  m.classList.add("done");
  m.querySelectorAll(".opts button")[a].classList.add("right");
  if (j === a) m.classList.add("ok"); else b.classList.add("wrong");
  score();
});

function buildNav(){
  var start = 0, html = "";
  M.forEach(function(m, mi){
    html += '<button data-i="'+start+'" data-m="'+mi+'"><span class="n">'+mi+'</span><span>'+m.t+'</span><span class="c">'+m.c.length+'</span></button>';
    start += m.c.length;
  });
  list.innerHTML = html;
  list.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ go(+b.dataset.i); nav.classList.remove("open"); };
  });
}

function go(i){
  cur = Math.max(0, Math.min(flat.length - 1, i));
  var f = flat[cur], m = M[f.mi], c = m.c[f.ci];
  card.innerHTML = "<h2>" + c.t + "</h2>" + (c.h || "") + (c.q ? quiz(c.q) : "");
  score();
  $("mod").textContent = m.t;
  $("count").textContent = (f.ci + 1) + " / " + m.c.length;
  $("bar").style.width = ((cur + 1) / flat.length * 100) + "%";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === flat.length - 1;
  list.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.dataset.m === f.mi); });
  try { localStorage.setItem("uhi-pos", cur); } catch(e){}
  history.replaceState(null, "", "#" + cur);
  window.scrollTo(0, 0);
}

$("prev").onclick = function(){ go(cur - 1); };
$("next").onclick = function(){ go(cur + 1); };
$("menu").onclick = function(){ nav.classList.toggle("open"); };
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "Escape") nav.classList.remove("open");
});
$("theme").onclick = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("uhi-theme", r.getAttribute("data-theme")); } catch(e){}
};
try { var th = localStorage.getItem("uhi-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

buildNav();
go(cur);
</script>
</body>
</html>
