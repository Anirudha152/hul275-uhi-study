<body>
<div class="app">
  <nav id="nav"><h1>Urban Heat Islands in the Tropics</h1><p class="sub">Lefevre et al. (2025) · review</p><div id="navlist"></div></nav>
  <main>
    <div class="top"><button class="menu" id="menu">Topics</button><div class="mod" id="mod"></div><div class="count" id="count"></div><button class="theme" id="theme">Theme</button></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="stage"><article class="card" id="card"></article></div>
    <div class="controls"><button id="prev">← Back</button><button class="next" id="next">Next →</button></div>
    <div class="hint">Use ← → arrow keys</div>
  </main>
</div>
<script>
// bars([[label, value], ...], max, unit, cls)
function bars(rows, max, unit, cls){
  unit = unit === undefined ? "" : unit; cls = cls || "";
  return '<div class="bars">' + rows.map(function(r){
    return '<div class="row"><span class="lab">'+r[0]+'</span><span class="track"><span class="fill '+cls+'" style="display:block;width:'+(Math.max(r[1],0)/max*100)+'%"></span></span><span class="val">'+r[1]+unit+'</span></div>';
  }).join("") + '</div>';
}

// Cards: {t, h} for content, {t, h?, q:[[question, [options], correctIndex, why], ...]} for quizzes
var M = [
/* ───────────────────────── 0. START ───────────────────────── */
{t:"Start here", c:[
{t:"The paper in one page", h:`
<p><b>Title:</b> "Urban heat island in the tropics: A review of advances, challenges, and future directions"</p>
<p><b>Authors:</b> A. Lefevre, B. Malet-Damour, H. Boyer, G. Rivière. They work at the PIMENT Laboratory, University of Reunion Island (France).</p>
<p><b>Journal:</b> <i>City and Environment Interactions</i>, vol. 28 (2025).</p>
<p><b>Type:</b> a <b>systematic literature review</b>. The authors didn't run new experiments. They collected and analysed <b>156 earlier studies</b> on urban heat in tropical cities.</p>
<p><b>Research question:</b> "How is the subject of Urban Heat Island specifically addressed in tropical regions?"</p>
<h3>Structure of the paper</h3>
<ol>
<li>Introduction: what UHI is and why the tropics are special</li>
<li>Methods: study area and how papers were picked (PRISMA)</li>
<li>Measuring UHI on the ground (in situ)</li>
<li>Measuring UHI from satellites (remote sensing)</li>
<li>Computer models of UHI</li>
<li>Solutions: green, blue, gray, less waste heat</li>
<li>Discussion: gaps and future directions</li>
<li>Conclusion</li>
</ol>
<div class="key">Main message: tropical UHI is different from temperate UHI. Research is concentrated in a few rich cities (especially Singapore). The field needs more multi-scale, multi-parameter, tropic-specific work.</div>`},
{t:"Words you need", h:`
<div class="tw"><table>
<tr><th>Word</th><th>Meaning</th></tr>
<tr><td><b>Urban heat island (UHI)</b></td><td>A city is warmer than the countryside around it.</td></tr>
<tr><td><b>Rural</b></td><td>Countryside, outside the city.</td></tr>
<tr><td><b>In situ</b></td><td>"On site": measured on the ground with real instruments.</td></tr>
<tr><td><b>Remote sensing</b></td><td>Measuring from far away, usually with satellites.</td></tr>
<tr><td><b>Albedo</b></td><td>How much sunlight a surface reflects. White = high albedo (stays cool). Black = low albedo (gets hot).</td></tr>
<tr><td><b>Evapotranspiration</b></td><td>Water leaving soil and plant leaves as vapour. It takes heat away, like sweat cooling you.</td></tr>
<tr><td><b>Sensible vs latent heat</b></td><td>Sensible heat is heat you can feel as temperature. Latent heat is energy used to evaporate water; it doesn't raise temperature.</td></tr>
<tr><td><b>Impervious surface</b></td><td>A surface water can't soak into: concrete, asphalt, roofs.</td></tr>
<tr><td><b>Anthropogenic heat (AH)</b></td><td>Waste heat from human activity: AC units, cars, factories.</td></tr>
<tr><td><b>Urban morphology</b></td><td>The physical shape of a city: building heights, spacing, street layout.</td></tr>
<tr><td><b>Microclimate</b></td><td>The climate of a small area, like a street or park.</td></tr>
<tr><td><b>Mesoscale</b></td><td>The size of a city or region (km to hundreds of km).</td></tr>
<tr><td><b>Thermal comfort</b></td><td>How hot or cold a person actually <i>feels</i>.</td></tr>
</table></div>
<p>More terms are explained when they first appear.</p>`}
]},

/* ───────────────────────── 1. BASICS ───────────────────────── */
{t:"What is a UHI?", c:[
{t:"Definition and history", h:`
<p><b>Urban heat island (UHI)</b> = a <b>positive temperature difference</b> between a city and the rural area around it.</p>
<div class="eq">UHI intensity = T<sub>urban</sub> − T<sub>rural</sub></div>
<p>Scientists have studied it for about <b>200 years</b>.</p>
<ul>
<li><b>1833, Howard</b>, in <b>London</b>, was the first to notice it. The city was up to <b>2 °C</b> warmer than the nearby countryside.</li>
<li><b>1927, Schmidt</b>, in <b>Vienna</b>, ran the first <b>mobile</b> survey: a car with a thermometer driving across the city.</li>
</ul>
<div class="key">Howard 1833 London, 2 °C = first detection. Schmidt 1927 Vienna, by car = first mobile transect.</div>`},
{t:"Why cities get hot: Oke's three causes", h:`
<p><b>Oke</b> identified the main mechanisms behind urban overheating:</p>
<ol>
<li><b>Urban morphology:</b> dense, tall buildings block wind, so there is less natural ventilation.</li>
<li><b>Surface replacement:</b> vegetation is replaced by <b>mineral materials</b> such as asphalt and concrete, which <b>store heat</b>.</li>
<li><b>Anthropogenic heat:</b> waste heat from vehicles, industry and <b>air conditioning</b>.</li>
</ol>
<p>These causes apply to cities everywhere. But <b>how</b> UHI shows up, and how much harm it does, depends on the climate zone. That's why the tropics need their own review.</p>`},
{t:"What counts as \"tropical\"?", h:`
<p>The paper uses the <b>Köppen(–Geiger) classification</b>, the most widely used climate classification system. It is based on where different <b>vegetation</b> grows, and has 5 groups:</p>
<div class="tw"><table>
<tr><th>Group</th><th>Name</th></tr>
<tr class="hl"><td><b>A</b></td><td>Equatorial / tropical (this paper's focus)</td></tr>
<tr><td>B</td><td>Arid</td></tr>
<tr><td>C</td><td>Warm temperate</td></tr>
<tr><td>D</td><td>Snow</td></tr>
<tr><td>E</td><td>Polar</td></tr>
</table></div>
<p><b>Tropical (type A) climate:</b></p>
<ul>
<li>The average temperature of <b>all 12 months is above 18 °C</b>.</li>
<li>High humidity, heavy rain, intense sunlight.</li>
<li>The <b>third most extensive</b> climate zone, covering about <b>19%</b> of Earth's land.</li>
<li>Mostly between the <b>Tropic of Cancer and the Tropic of Capricorn</b> (about 23.5° N to 23.5° S).</li>
</ul>`},
{t:"The tropical subtypes", h:`
<div class="tw"><table>
<tr><th>Code</th><th>Name</th><th>Key feature</th></tr>
<tr><td><b>Af</b></td><td>Tropical Rainforest</td><td>Rain all year: more than <b>60 mm every month</b>. Very humid, stable.</td></tr>
<tr><td><b>Am</b></td><td>Tropical Monsoon</td><td>A big rainy (monsoon) season plus a short dry season.</td></tr>
<tr><td><b>Aw</b></td><td>Tropical Wet and Dry / Savannah</td><td>A clear, long <b>dry season</b>. Most widespread tropical type.</td></tr>
<tr><td><b>As</b></td><td>Tropical Dry Summer</td><td>The dry season falls in summer. Rare.</td></tr>
</table></div>
<p>Examples in the paper:</p>
<ul>
<li>Singapore and Kuala Lumpur are <b>Af</b>.</li>
<li>Lagos is <b>Am</b>.</li>
<li>Nagpur, Kolkata, Ibadan and Presidente Prudente (Brazil) are <b>Aw</b>.</li>
<li>Chennai is <b>As</b>.</li>
</ul>
<div class="tip">"f" = feucht (wet all year), "m" = monsoon, "w" = winter dry, "s" = summer dry. Remember Af = rainforest, Aw = savannah.</div>`},
{t:"Why tropical UHIs are different", h:`
<div class="vs">
<div><h3>Temperate cities (e.g. Europe)</h3><ul><li>UHI is strongest <b>at night</b>.</li><li>It can even be <b>negative in the day</b>: the city is cooler than the countryside.</li></ul></div>
<div><h3>Tropical cities</h3><ul><li>UHI can last <b>throughout the day</b>.</li><li>There are <b>daytime peaks</b> in some cases, especially in the <b>wet season</b>.</li></ul></div>
</div>
<p><b>Why?</b> Three things combine:</p>
<ul>
<li>High solar irradiance (strong sun)</li>
<li>High moisture in the air</li>
<li>The thermal properties of the building materials used</li>
</ul>
<h3>Evidence from earlier studies</h3>
<ul>
<li><b>Amorim &amp; Dubreuil:</b> a tropical Brazilian city reached a UHI of <b>6 °C</b>, compared with <b>3.5 °C</b> in a temperate French city.</li>
<li><b>Khan et al.:</b> tropical UHI tends to be highest in <b>drier months</b>.</li>
<li><b>Chatterjee et al.:</b> cool roofs and reflective pavements work <b>less well</b> in the tropics than <b>vegetation-based</b> solutions.</li>
<li>Tropical UHIs raise risks to <b>health, thermal comfort and energy use</b>.</li>
</ul>`},
{t:"Fast, messy urban growth", h:`
<p>Many tropical cities grow <b>rapidly</b>, often in an <b>organic, unregulated</b> way.</p>
<ul>
<li>Western cities often follow planned <b>grid</b> layouts.</li>
<li>Tropical cities have <b>less formal</b> layouts. The result is mixed urban forms, <b>sprawl</b>, and a mix of high- and low-density areas.</li>
</ul>
<p>This makes UHI worse in three ways:</p>
<ul>
<li>more land cover change</li>
<li>less vegetation</li>
<li>altered microclimates</li>
</ul>
<p><b>Demographic boom:</b> according to the <b>IPCC</b>, <b>more than 90%</b> of global population growth in the coming decades will happen in <b>low-latitude</b> (tropical) areas.</p>
<div class="key">The tropics combine the fastest urban growth with high exposure to heat. So adaptation strategies built for them are urgent.</div>`},
{t:"What earlier reviews did, and the gap", h:`
<p>Earlier reviews each covered only one piece:</p>
<ul>
<li><b>Liu et al.:</b> guidelines for <b>measurement</b> (experimental) studies in the tropics.</li>
<li><b>Banerjee et al.:</b> urban design for thermal comfort in <b>Singapore</b>.</li>
<li><b>Giridharan &amp; Emmanuel</b> and <b>Sari:</b> how urban <b>compactness</b> and <b>building design</b> affect UHI.</li>
<li><b>Singh et al.:</b> high-resolution modelling of <b>anthropogenic heat</b> from buildings and AC in Singapore.</li>
</ul>
<p><b>The gap:</b> no systematic review had brought together <b>remote sensing + observations + numerical modelling</b> for tropical UHI, including the latest advances.</p>
<p><b>This paper's aim:</b> a <b>holistic</b> view of tropical UHI research. It covers measurement, satellites, models and mitigation, and asks how effective each is in the tropics.</p>`},
{t:"Quiz: What is a UHI?", q:[
["Who first detected the urban heat island, and where?", ["Oke, in Vancouver","Howard, in London","Schmidt, in Vienna","Köppen, in Berlin"], 1, "Howard (1833) found London up to 2 °C warmer than the countryside."],
["Which is NOT one of Oke's three main causes of urban overheating?", ["Dense, tall buildings reducing ventilation","Replacing vegetation with asphalt and concrete","Higher rainfall in cities","Waste heat from vehicles, industry and AC"], 2, "Oke's three are morphology, heat-storing mineral surfaces and anthropogenic heat."],
["A climate is Köppen 'tropical' (A) if…", ["Annual rainfall is above 2000 mm","Every month averages above 18 °C","The city is on the equator","Humidity is above 70% all year"], 1, "All twelve monthly averages must exceed 18 °C."],
["Roughly how much of Earth's land surface do tropical climates cover?", ["5%","11.5%","19%","35%"], 2, "About 19%. It is the third most extensive climate zone. (11.5% is Aw alone.)"],
["How does tropical UHI typically differ from temperate UHI?", ["Tropical UHI happens only at night","Tropical UHI can persist through the day, with daytime peaks in the wet season","Tropical UHI is always negative in the day","There is no difference"], 1, "Temperate UHI peaks at night and can be negative by day. Tropical UHI can last all day."],
["Amorim & Dubreuil compared a tropical Brazilian city with a temperate French city. Their UHI values were:", ["6 °C vs 3.5 °C","2 °C vs 2 °C","3.5 °C vs 6 °C","10 °C vs 1 °C"], 0, "The tropical city reached 6 °C; the temperate one 3.5 °C."],
["According to the IPCC, what share of global population growth will happen in low-latitude areas?", ["About 50%","About 70%","More than 90%","Less than 30%"], 2, "More than 90%. This is why tailored tropical adaptation is urgent."],
["Chatterjee et al. found that in tropical settings…", ["Cool roofs beat all other solutions","Vegetation-based solutions work better than cool roofs or reflective pavements","Nothing reduces UHI","Water bodies are the best solution"], 1, "Conventional cool roofs and reflective pavements were less effective than vegetation."],
["Which Köppen tropical subtype has more than 60 mm of rain in every month?", ["Aw","As","Am","Af"], 3, "Af, tropical rainforest: wet all year."]
]}
]},

/* ───────────────────────── 2. METHODS ───────────────────────── */
{t:"How the review was done", c:[
{t:"Rules for the study area", h:`
<p>A study was included only if it met <b>both</b> conditions:</p>
<ol>
<li>It is located between latitudes <b>−23.5° and +23.5°</b> (between the two tropics).</li>
<li>Its climate is <b>Köppen A</b>: Af, Am, Aw or As.</li>
</ol>
<p><b>Excluded</b>, even if inside the tropics:</p>
<ul>
<li>Subtropical climates such as <b>Cfa</b> and <b>Cwa</b></li>
<li>Arid climates such as <b>BSh</b> and <b>BWh</b></li>
</ul>
<p>The authors also <b>excluded</b> type-A climates <b>outside</b> the tropics. This keeps the data processing consistent.</p>
<p>"City" means the study location as the original authors named it. It could be a municipality, a metropolitan area or a district.</p>`},
{t:"Where the studies are: cities and countries", h:`
<p><b>Number of studies per city (Fig 1):</b></p>
${bars([["Singapore",37],["Kolkata",8],["Putrajaya",7],["Kuala Lumpur",7],["Pres. Prudente",6],["Chennai",6],["Lagos",5],["Bangkok, Rio, Jakarta, Kampala",4]],37)}
<p><b>Number of studies per country (Fig 2):</b></p>
${bars([["Singapore",37],["India",21],["Malaysia",19],["Brazil",14],["Nigeria",11],["Indonesia",9],["China",8],["Sri Lanka",7]],37,"","b2")}
<ul>
<li><b>Singapore</b> is the main research hub, with the most publications.</li>
<li><b>Tropical Africa</b> and <b>small tropical islands</b> have very few studies.</li>
<li>The authors' explanation: unequal <b>research infrastructure, funding and scientific output</b>.</li>
</ul>`},
{t:"Climate subtypes: the Aw mismatch", h:`
<p><b>Share of studies by Köppen subtype (Fig 3):</b></p>
${bars([["Af (rainforest)",44.9],["Aw (savannah)",34],["Am (monsoon)",11.5],["Multiple",6.4],["As (dry summer)",3.2]],44.9,"%")}
<ul>
<li><b>As</b> is represented <b>only by Chennai</b> studies.</li>
<li>Af dominates mainly because of <b>Singapore</b> (an Af city).</li>
</ul>
<h3>The mismatch</h3>
<ul>
<li><b>Aw</b> covers about <b>11.5% of global land</b>. It is the <b>most widespread</b> tropical subtype.</li>
<li>Af and Am together cover <b>less</b> land than Aw.</li>
<li>Yet Aw gets only about <b>a third</b> of studies, while Af gets <b>nearly half</b>.</li>
</ul>
<p><b>Reason:</b> Aw regions, such as <b>Sub-Saharan Africa</b> and <b>central India</b>, have fewer research institutions and less funding.</p>
<div class="key">Af is over-represented (because of Singapore). Aw is under-represented, even though it is the most widespread and is urbanising rapidly. This is a research gap.</div>
<div class="tip">Don't mix up the two 11.5% figures. Am = 11.5% of <i>studies</i>. Aw = 11.5% of global <i>land</i>.</div>`},
{t:"Finding the papers: PRISMA", h:`
<p><b>PRISMA</b> is a standard step-by-step method for systematic reviews. You find papers, screen them, check eligibility, and include the ones that pass.</p>
<ul>
<li><b>Database:</b> <b>Dimensions.ai</b>, shown to be reliable by Thelwall.</li>
<li><b>Search terms:</b> "Urban Heat Island" AND "Tropics", and "Urban Heat Island" AND "Tropical".</li>
<li><b>Searched:</b> titles, keywords and abstracts, for all periods up to <b>July 2024</b>.</li>
<li><b>Found:</b> <b>508</b> documents.</li>
</ul>
<p><b>Excluded:</b></p>
<ul>
<li>Review articles, book chapters, non-peer-reviewed work, conference proceedings</li>
<li>Studies not in the intertropical region</li>
<li>Studies not directly about UHI (off-topic)</li>
<li>Papers not in English</li>
</ul>
<p>Screening happened in two passes: first title and abstract, then full text.</p>
<div class="eq">508 found − 352 excluded = 156 included</div>`},
{t:"The PRISMA flowchart (Fig 4)", h:`
<figure><img src="img/prisma.jpg" alt="PRISMA flowchart: 486 + 56 records, 34 duplicates removed, 508 identified, screening, 334 sought, 46 not retrieved, 288 assessed, 132 excluded, 156 included"><figcaption>Identification → Screening → Included.</figcaption></figure>
<ul>
<li>486 records ("Tropical") + 56 ("Tropics") − 34 duplicates = <b>508</b></li>
<li>Title and abstract screening removed 89 that were not original papers and 85 that were off-topic. 334 were sought.</li>
<li>46 couldn't be retrieved, leaving 288 assessed. 132 more were excluded, leaving <b>156 included</b>.</li>
</ul>
<p><b>Studies per topic:</b></p>
${bars([["Experimental",69],["Numerical modelling",68],["Remote sensing",58],["Solutions",43]],69)}
<p>These add up to more than 156 because some studies cover several topics.</p>`},
{t:"Publications over time (Fig 5)", h:`
<p>Only 12 of the 156 papers are from before 2012. The oldest is from 1987.</p>
${bars([["2012",5],["2013",1],["2014",3],["2015",8],["2016",11],["2017",9],["2018",8],["2019",9],["2020",21],["2021",24],["2022",25],["2023",11],["2024 (to July)",9]],25)}
<ul>
<li>There is a <b>marked increase after 2015</b>.</li>
<li>The <b>peak is 2020–2022</b>, followed by a decline in 2023.</li>
</ul>
<p><b>Why the rise?</b> The authors give two kinds of reason:</p>
<ol>
<li><b>Genuine interest:</b> UHI matters more with climate change and urban vulnerability.</li>
<li><b>Structural changes in publishing:</b>
<ul>
<li>more open-access journals</li>
<li>better digital indexing</li>
<li>cheaper monitoring technology, such as remote sensing and temperature loggers</li>
<li>more institutional <b>pressure to publish</b></li>
</ul></li>
</ol>`},
{t:"Four themes in the literature", h:`
<p>The authors read the papers and grouped them by theme:</p>
<ol>
<li><b>Characterisation</b>: describing the UHI using <b>in situ measurements</b> or <b>remote sensing</b>.</li>
<li><b>Modelling</b>: building, calibrating or validating computer models.</li>
<li><b>Mitigation</b>: testing solutions using <b>gray, green or blue</b> infrastructure.</li>
</ol>
<p>Fig 4 counts these as four topics: experimental, remote sensing, numerical modelling and solutions.</p>
<p>Many studies span several categories, for example models combined with measurements. That's why the totals exceed 156. It also shows UHI research is <b>interdisciplinary</b>.</p>`},
{t:"Four types of UHI", h:`
<p>"UHI" can mean different things depending on <b>where</b> you measure:</p>
<div class="tw"><table>
<tr><th>Type</th><th>What it measures</th><th>How</th></tr>
<tr class="hl"><td><b>Surface UHI (SUHI)</b></td><td>The temperature of ground and roof surfaces. The most commonly discussed type.</td><td>Satellite <b>Land Surface Temperature (LST)</b></td></tr>
<tr class="hl"><td><b>Atmospheric UHI</b>, also called the <b>canopy-layer UHI</b></td><td>The air temperature near the ground, where people live</td><td><b>In situ</b> air temperature sensors</td></tr>
<tr><td><b>Urban Boundary Layer UHI (UBL-UHI)</b></td><td>Vertical temperature differences higher up in the atmosphere</td><td>Less often studied</td></tr>
<tr><td><b>Subsurface UHI (SSUHI)</b></td><td>Heat stored <b>underground</b></td><td>Less often studied</td></tr>
</table></div>
<p>Each type comes from different physical processes and needs different methods. They must be kept <b>distinct</b> to compare studies properly.</p>
<div class="key">Satellite = surface temperature = SUHI. Ground sensors = air temperature = atmospheric/canopy UHI.</div>`},
{t:"Quiz: How the review was done", q:[
["Which database did the authors use to find papers?", ["Scopus","Web of Science","Dimensions.ai","Google Scholar"], 2, "Dimensions.ai, judged reliable by Thelwall."],

["Which country has the most studies by far?", ["India","Brazil","Malaysia","Singapore"], 3, "Singapore, with 37. India is second with 21."],

["Studies in the As climate come only from which city?", ["Chennai","Kolkata","Lagos","Bangkok"], 0, "As (tropical dry summer) = only Chennai studies (3.2%)."],
["Which was NOT an exclusion criterion?", ["Review articles","Non-English papers","Conference proceedings","Studies that used satellite data"], 3, "Satellite studies were included. Reviews, non-English, proceedings and off-topic papers were excluded."],

["When did tropical UHI publications peak?", ["1995–2000","2010–2012","2020–2022","2023–2024"], 2, "A sharp rise after 2015, a peak in 2020–2022, then a decline in 2023."],

]}

/* ───────────────────────── 3. IN SITU ───────────────────────── */
{t:"Measuring on the ground", c:[
{t:"Two ways to characterise UHI", h:`
<div class="vs">
<div><h3>In situ (field data)</h3><p>Instruments on the ground measure air temperature differences between the <b>urban canopy</b> and rural areas. They also measure how temperature varies <b>within</b> the city.</p></div>
<div><h3>Remote sensing (satellites)</h3><p>Satellites measure <b>surface</b> temperature differences between the city and the countryside.</p></div>
</div>
<p>In situ methods come in two kinds:</p>
<ul><li><b>Mobile measurements</b> (transects)</li><li><b>Fixed measurements</b> (weather stations)</li></ul>
<p><b>Urban canopy:</b> the layer of air between the ground and the rooftops, where people live.</p>`},
{t:"Mobile transects: the idea", h:`
<p>A <b>transect</b> is a pre-planned route across the city. Sensors are mounted on a <b>vehicle</b>, a bike, or carried <b>on foot</b>, and record temperature along the way.</p>
<p>History: Schmidt, 1927, in Vienna, by car.</p>
<div class="vs">
<div><h3>Advantages</h3><ul><li><b>Fine-grained spatial</b> mapping</li><li><b>Cost-effective</b> and <b>flexible</b></li><li>Useful where there are few fixed stations</li></ul></div>
<div><h3>Disadvantages</h3><ul><li>Only <b>momentary "snapshots"</b></li><li>Can't track UHI over time</li><li>Hard to <b>synchronise</b> readings across time and space</li></ul></div>
</div>
<p><b>Why the snapshot problem is worse in the tropics:</b> humidity, sunlight and cloud cover change <b>rapidly</b> during the day, so a reading taken an hour later can differ a lot.</p>
<div class="key">Only <b>7</b> of the 156 studies used mobile transects. The method is rare in the tropics, possibly because repeated runs are logistically demanding.</div>`},
{t:"Mobile transect studies (Table 1)", h:`
<div class="tw"><table>
<tr><th>Study</th><th>City / Köppen</th><th>Mode</th><th>When</th><th>Focus</th><th class="r">ΔT</th></tr>
<tr><td>Wong &amp; Yu</td><td>Singapore / Af</td><td>Car</td><td>Night (2–4 a.m.)</td><td>Role of vegetation</td><td class="r">4.01 °C</td></tr>
<tr><td>Qaid et al.</td><td>Putrajaya / Af</td><td>Car</td><td>Day &amp; night, 6×/day</td><td>UHI + thermal comfort</td><td class="r">3 °C</td></tr>
<tr><td>Lindén</td><td>Ouagadougou (Burkina Faso) / Aw</td><td>Car</td><td>Evening &amp; night</td><td>Vegetation + water</td><td class="r">1.9 °C UHI; 5 °C cool island</td></tr>
<tr><td>Kotharkar et al.</td><td>Nagpur / Aw</td><td>Car</td><td>Night</td><td>Urban form</td><td class="r">3.53 °C</td></tr>
<tr><td>Cardoso et al.</td><td>3 Brazilian cities / Aw</td><td>Car</td><td>Evening</td><td>Morphology + vegetation, <b>medium-sized</b> cities</td><td class="r">2.7–6 °C</td></tr>
<tr><td>Jeganathan et al.</td><td>Chennai / As</td><td>Car</td><td>Morning &amp; evening</td><td>Intra-urban variation</td><td class="r">3–4.5 °C</td></tr>
<tr><td>Chàfer et al.</td><td>Singapore / Af</td><td><b>On foot</b></td><td>Day, evening, night</td><td>Urban morphology</td><td class="r">1.03–4.5 °C</td></tr>
</table></div>
<p><b>A pattern:</b> the transport mode matches the scale of the study.</p>
<ul>
<li><b>Cars</b> are used for city-scale or between-neighbourhood comparisons.</li>
<li><b>Walking or cycling</b> is used for fine-scale work in streets and parks.</li>
</ul>
<p>A <b>cool island</b> is the opposite of a heat island: an area cooler than its surroundings, for example due to vegetation or water.</p>`},
{t:"Mobile transects: the problems", h:`
<h3>1. Wrong time of day</h3>
<ul>
<li>Most studies measure at <b>night or late afternoon</b>. Those are the peak UHI times in <b>temperate</b> zones.</li>
<li>In the tropics, <b>daytime heat stress is more severe</b>, because of continuous solar radiation, especially in the <b>wet season</b>.</li>
<li>So night-only studies <b>miss daytime discomfort</b> and capture only one side of the problem.</li>
</ul>
<h3>2. Not really "UHI"</h3>
<ul>
<li>Many studies that claim to measure UHI actually compare <b>intra-urban</b> areas, for example built-up vs vegetated parts of the same city.</li>
<li>A true UHI compares <b>urban vs rural</b>.</li>
<li>So transects suit <b>local thermal contrasts</b>, not broad UHI intensity.</li>
</ul>
<h3>Fix</h3>
<p>Complement transects with <b>fixed stations</b>, plus <b>remote sensing</b> where possible. Satellites also give only intermittent snapshots.</p>`},
{t:"Fixed stations: the idea", h:`
<p><b>Fixed meteorological stations</b> are permanent weather stations placed in urban and rural areas.</p>
<ul>
<li>They collect <b>continuous</b> data, revealing <b>daily and seasonal</b> patterns.</li>
<li>UHI intensity = the difference between <b>at least two stations</b>: one urban, one rural.</li>
<li>A <b>network</b> of stations gives better spatial detail across city zones.</li>
</ul>
<p><b>Scales used in studies:</b></p>
<div class="tw"><table>
<tr><th>Scale</th><th>Example</th></tr>
<tr><td>National</td><td>Simath &amp; Emmanuel: a station network across <b>Sri Lanka</b></td></tr>
<tr><td>City</td><td>Singapore and Putrajaya studies. <b>Balogun, Akure (Nigeria):</b> only <b>2 stations</b> (urban + airport). <b>Amorim &amp; Dubreuil, Presidente Prudente:</b> UHI stronger in the tropical city than in the temperate one.</td></tr>
<tr><td>Neighbourhood</td><td>Yola et al., Indonesia: multi-point measurements + simulation</td></tr>
<tr><td>Street</td><td>Chow &amp; Roth and Acero (Singapore), Sharmin (Dhaka), Ramakreshnan (Kuala Lumpur): temperature + humidity for pedestrian comfort</td></tr>
</table></div>
<p><b>Upper air:</b> <b>Hung &amp; Shih</b> used surface stations plus <b>radiosondes</b> (weather balloons) in <b>Taiwan</b>. They found stronger <b>upper-troposphere warming</b>, especially <b>December–March</b>.</p>`},
{t:"Micro-scale monitoring", h:`
<p>Newer studies use small sensors at very fine scales:</p>
<ul>
<li><b>Weitz et al. (Kolkata):</b> <b>miniature sensors</b> measured heat exposure in <b>slums</b>.</li>
<li><b>Ow et al. (Singapore):</b> the effect of <b>tree shade</b> on surface temperatures.</li>
<li><b>Hwang et al. (Singapore):</b> conditions in <b>urban parks</b> (wind, air temperature, mean radiant temperature).</li>
<li><b>Acero et al.:</b> how well <b>standalone trees</b> cool. <b>Tree species</b> and <b>diffuse radiation</b> matter.</li>
</ul>
<h3>Weitz et al., in detail (Table 5)</h3>
<ul>
<li>130 urban and 180 rural residents <b>wore</b> mini-sensors.</li>
<li>In the city, <b>indoors was hotter than outdoors</b>, especially at night.</li>
<li>Urban residents were <b>4.3×</b> more exposed to a Heat Index above 45 °C.</li>
<li>Rural <b>women</b> were more exposed than men.</li>
</ul>`},
{t:"What fixed stations show: Aw vs Af", h:`
<div class="vs">
<div><h3>Aw (savannah): e.g. Nigeria, Brazil</h3><ul><li>Night-time UHI often <b>2–4 °C in the dry season</b></li><li>Sometimes up to <b>7 °C</b> in certain urban forms</li><li><b>Seasonality dominates</b>: the wet/dry contrast amplifies UHI</li></ul></div>
<div><h3>Af (rainforest): e.g. Singapore</h3><ul><li>UHI peaks align with the <b>monsoon</b> period</li><li>Strongest in <b>dense commercial areas</b></li><li><b>More stable</b> but <b>humidity-amplified</b>, tied to anthropogenic heat and dense buildings</li></ul></div>
</div>
<h3>More examples</h3>
<ul>
<li><b>Correa et al., Vitória (Brazil):</b> stronger UHI and SUHI in <b>spring/summer</b>.</li>
<li><b>Setiawati et al., Indonesia:</b> adding vegetation <b>lowered</b> UTCI in Surabaya (<b>−0.84 °C</b>), but <b>raised</b> it in Denpasar and Medan (<b>+3.1 °C</b>).</li>
</ul>
<p>UTCI is a "feels-like" heat stress index, explained in the next module. The point of the Setiawati result: <b>greening doesn't always help</b>. It depends on climate and urban form.</p>`},
{t:"Fixed-station highlights (Table 5)", h:`
<div class="tw"><table>
<tr><th>Study</th><th>City</th><th>Finding</th></tr>
<tr><td>Chow &amp; Roth</td><td>Singapore / Af</td><td>UHI max about <b>7 °C</b> in a commercial zone during the <b>monsoon (May–Aug)</b>, <b>3–4 h after sunset</b></td></tr>
<tr><td>Roth et al.</td><td>Singapore / Af</td><td><b>20 stations, 6 years</b>. Average night UHI <b>2.8–3.7 °C</b></td></tr>
<tr><td>Ramakreshnan et al.</td><td>Kuala Lumpur / Af</td><td>Max 1.71 °C; stronger at night in the dry monsoon</td></tr>
<tr><td>Ahmed et al.</td><td>Putrajaya / Af</td><td>Night UHI 2 °C, negligible by day. <b>Street orientation</b> and <b>vegetation</b> matter</td></tr>
<tr><td>Balogun</td><td>Akure / Aw</td><td>Night UHI up to <b>4 °C (dry season)</b>; about 2 °C by day (wet season)</td></tr>
<tr><td>Adebayo</td><td>Ibadan / Aw</td><td>Stronger at night (1 °C, dry season); weak by day</td></tr>
<tr><td>Zhang &amp; Wu</td><td>Sanya, China / Aw</td><td><b>Chinese New Year tourism</b> raised UHI (+0.66 °C max)</td></tr>
<tr><td>Best et al.</td><td>Paramaribo / Am</td><td>Green zones up to <b>−2.5 °C</b></td></tr>
<tr><td>Sharmin et al.</td><td>Dhaka / Aw</td><td>1–3.8 °C differences by urban form. <b>Diverse</b> forms (mixed plot sizes and heights) give better comfort</td></tr>
<tr class="hl"><td>Rajapaksha et al.</td><td>Darwin, Australia / Aw</td><td>Anthropogenic heat: <b>buildings 87–95%</b>, traffic 4–13%, human metabolism 0.5%</td></tr>
</table></div>`},
{t:"Fixed stations: the verdict", h:`
<div class="vs">
<div><h3>Strengths</h3><ul><li><b>Long-term</b> records over years or decades</li><li>Track <b>seasonal and year-to-year</b> trends</li><li>Can test whether <b>mitigation works</b> over time</li><li>Show <b>climate-specific</b> patterns (Af vs Aw vs Am)</li></ul></div>
<div><h3>Weaknesses</h3><ul><li>Need <b>big investment and maintenance</b></li><li>Few points, so they can miss fine spatial detail</li></ul></div>
</div>
<div class="key">Mobile gives good space detail but poor time detail. Fixed gives good time detail but poor space detail. Use <b>both</b>.</div>`},
{t:"Quiz: Measuring on the ground", q:[
["How many of the reviewed studies used mobile transects?", ["7","19","43","69"], 0, "Only seven. The method is rare in the tropics."],
["The main weakness of mobile transects is that they…", ["Are very expensive","Give only momentary snapshots, so they can't track UHI over time","Can't measure air temperature","Only work in rural areas"], 1, "They give a snapshot; tropical weather changes rapidly during the day."],
["Why can night-only transects be a problem in the tropics?", ["Sensors don't work at night","Tropical daytime heat stress is more severe, so night-only studies miss it","UHI doesn't exist at night","Cars can't drive at night"], 1, "Continuous sunlight makes daytime discomfort severe, especially in the wet season."],
["Many 'UHI' transect studies actually measured…", ["Urban vs rural differences","Intra-urban differences, e.g. built-up vs vegetated areas","Ocean temperatures","Indoor temperatures"], 1, "Transects suit local contrasts, not true urban–rural UHI intensity."],
["The minimum needed to measure UHI intensity with fixed stations is…", ["One urban station","Two stations, one urban and one rural","Ten stations","A satellite"], 1, "At least one urban and one rural station."],
["Which Singapore study found a UHI of about 7 °C in a commercial zone during the monsoon, 3–4 h after sunset?", ["Roth et al.","Wong & Yu","Chow & Roth","Chàfer et al."], 2, "Chow & Roth."],
["In Aw (savannah) cities, fixed stations typically show…", ["Stable UHI all year","Strong night-time UHI in the dry season (2–4 °C, sometimes up to 7 °C)","No UHI at all","UHI only in the wet season"], 1, "Seasonality dominates in Aw. Af is more stable but humidity-amplified."],
["In Darwin, which source produced most anthropogenic heat?", ["Traffic","Human metabolism","Buildings (87–95%)","Industry"], 2, "Buildings 87–95%, traffic 4–13%, metabolism 0.5%."],
["Weitz et al.'s Kolkata wearable-sensor study found that…", ["Rural residents were more exposed than urban ones","Urban residents were 4.3× more exposed to Heat Index above 45 °C, and indoors was hotter than outdoors","Men were more exposed than women everywhere","Slums were cooler than the countryside"], 1, "Urban residents 4.3× more exposed; rural women more exposed than men."],
["Setiawati et al. found that vegetation scenarios…", ["Lowered UTCI everywhere","Lowered UTCI in Surabaya but raised it in Medan and Denpasar","Had no effect","Raised UTCI everywhere"], 1, "−0.84 °C in Surabaya, +3.1 °C in Medan/Denpasar. Greening isn't automatically good."]
]}
]},

/* ───────────────────────── 4. PARAMETERS & COMFORT ───────────────────────── */
{t:"What gets measured", c:[
{t:"Which parameters studies measure (Fig 6)", h:`
<p>How often each parameter was measured in experimental papers:</p>
${bars([["Tair (air temp)",57],["RH (humidity)",24],["Tsurf (surface temp)",22],["Vair (wind speed)",13],["MRT",6],["Gi (solar irradiance)",4]],57)}
<ul>
<li><b>Air temperature</b> dominates.</li>
<li><b>Radiation</b> (Gi, MRT) is measured rarely, even though the tropical sun is intense.</li>
</ul>
<div class="key">The ranking to remember: Tair &gt; RH &gt; Tsurf &gt; Vair &gt; MRT &gt; Gi.</div>`},
{t:"Air temperature vs surface temperature", h:`
<div class="vs">
<div><h3>Air temperature (Tair)</h3><ul><li>Measured <b>2–3 m above ground</b> in a <b>ventilated shelter</b></li><li>Shows the ambient conditions people are exposed to</li><li>The <b>main parameter</b> for UHI intensity</li></ul></div>
<div><h3>Surface temperature (Tsurf)</h3><ul><li>Measured <b>on</b> surfaces with <b>thermocouples</b> or <b>infrared sensors</b></li><li>Shows how materials <b>store and emit</b> heat</li><li>An important <b>complement</b> to Tair</li></ul></div>
</div>
<p>Examples of Tair-focused studies: Roth, Manik &amp; Syaukat, Zhang &amp; Wu, Adebayo, Teo.</p>
<p>Studies that also measured Tsurf: Tso, Amorim, Maskulrath, Al-ameri.</p>`},
{t:"Humidity and wind", h:`
<ul>
<li><b>24 studies</b> emphasised <b>humidity</b>, for example Amorim and Best et al.
<ul>
<li>Moisture matters a lot for comfort in the tropics.</li>
<li>Humidity data lets researchers compare <b>wet vs dry seasons</b>.</li>
<li>They showed how high humidity in the <b>wet season</b> hurts comfort.</li>
</ul></li>
<li>Only <b>13 studies</b> measured <b>air velocity (wind)</b>, for example Wong, Lindén &amp; Holmer, Rajagopalan.
<ul><li>These studies stressed that <b>ventilation</b> moderates UHI.</li></ul></li>
</ul>
<p><b>Why it matters:</b> on a humid day, sweat can't evaporate, so you feel hotter at the same temperature. Wind helps sweat evaporate and carries heat away.</p>`},
{t:"Outdoor thermal comfort (OTC)", h:`
<p><b>Problem:</b> air temperature alone doesn't capture how hot people <b>feel</b>, especially in the tropics. There, <b>humidity</b> and <b>solar radiation</b> matter a lot.</p>
<p><b>Outdoor thermal comfort (OTC)</b> combines several factors:</p>
<ul><li>temperature</li><li>humidity</li><li>radiation</li><li>air movement</li></ul>
<div class="key">Only <b>19 studies</b> combined UHI analysis with thermal comfort evaluation.</div>`},
{t:"Mean Radiant Temperature (MRT)", h:`
<p><b>MRT</b> sums up all the radiant heat hitting a person from <b>every direction</b>. It includes:</p>
<ul>
<li><b>Short-wave</b> radiation: direct and reflected sunlight.</li>
<li><b>Long-wave</b> radiation: heat glowing from hot walls and ground.</li>
</ul>
<p>Think of standing next to a sun-baked wall. The air may be 32 °C, but you feel much hotter. MRT captures that.</p>
<ul>
<li>MRT is one of the <b>most crucial</b> OTC indicators.</li>
<li>It is needed to calculate advanced indices such as <b>PET</b>.</li>
<li>Yet it is <b>underused</b>: measured in only a few studies, mostly in Singapore and Dhaka.</li>
</ul>`},
{t:"Thermal comfort indices", h:`
<div class="tw"><table>
<tr><th>Index</th><th>Full name</th><th>Note / used by</th></tr>
<tr class="hl"><td><b>PET</b></td><td>Physiological Equivalent Temperature</td><td>By <b>Höppe</b>. Needs MRT. Acero, Sun, Rajan &amp; Amirtham</td></tr>
<tr class="hl"><td><b>UTCI</b></td><td>Universal Thermal Climate Index</td><td>By <b>Jendritzky</b>, Bröde. Used in <b>7 studies</b> (Setiawati, Sun, Dutta)</td></tr>
<tr><td><b>SET</b></td><td>Standard Effective Temperature</td><td>Huang &amp; Chen</td></tr>
<tr><td><b>THI</b></td><td>Thermohygrometric Index</td><td>Balogun et al., Doan et al.</td></tr>
<tr><td><b>Humidex</b></td><td>Combines temperature + humidity</td><td>Obe et al.</td></tr>
<tr><td><b>TDI</b></td><td>Thom's Discomfort Index</td><td>Silva et al.</td></tr>
</table></div>
<p><b>Occurrences of OTC indicators (Fig 7):</b></p>
${bars([["PET",9],["MRT",8],["UTCI",7],["Other",10]],10)}
<div class="tip">PET → Höppe. UTCI → Jendritzky. "Humidex" = temperature + humidity. These names are easy MCQ targets.</div>`},

/* ───────────────────────── 5. REMOTE SENSING ───────────────────────── */
{t:"Satellites and land change", c:[
{t:"Satellites in the tropics", h:`
<p><b>Remote sensing</b> uses satellite or aerial images, often <b>thermal infrared</b>. It is good for <b>large areas</b>. It measures <b>Land Surface Temperature (LST)</b>, giving the <b>surface UHI (SUHI)</b>.</p>
<p><b>Big tropical problem:</b> persistent <b>cloud cover</b>, especially in the <b>wet season</b>. Clouds block thermal images.</p>
<p><b>Early work:</b> <b>Tso</b> and <b>Nichol</b> used <b>Landsat</b> over Singapore and Kuala Lumpur.</p>
<ul>
<li>They showed that <b>solar azimuth</b> (the sun's direction) affects surface temperature patterns.</li>
<li>They showed satellites can still indicate <b>daytime</b> UHI when skies are clear.</li>
</ul>
<p>Remote sensing combined with <b>GIS</b> (mapping software) has been very useful. Malaysian research worked around frequent cloud to improve LST mapping.</p>`},
{t:"Landsat vs MODIS", h:`
<div class="vs">
<div><h3>Landsat</h3><ul><li><b>High spatial</b> resolution (fine detail)</li><li>But it passes over only <b>every 16 days</b></li><li>Best for <b>detailed urban-scale</b> study and precise urban–rural comparison</li></ul></div>
<div><h3>MODIS</h3><ul><li><b>Daily</b> coverage</li><li>But <b>coarse</b> resolution (about <b>1 km</b>)</li><li>Best for <b>regional/national</b> and <b>seasonal</b> analysis</li></ul></div>
</div>
<p><b>Example: Ayanlade, Lagos, MODIS 2002–2013</b></p>
<ul>
<li>Night-time surface UHI was <b>stronger in the dry season</b>.</li>
<li>The paper links this to the <b>urban–rural thermo-hydrological contrast</b>: how differently the city and the countryside handle heat and water. It is largest when vegetation is dry.</li>
<li>In plain terms: dry air and dry ground let the countryside lose heat fast at night, while concrete keeps the city warm. So the gap is biggest.</li>
<li>This matches earlier work showing that <b>vegetation moisture</b> shapes early-morning LST in humid tropical cities (Acero &amp; González-Asensio).</li>
</ul>
<p>Combining <b>Landsat + MODIS</b> gives a fuller picture over time.</p>
<div class="key">Landsat = sharp but rare (16 days). MODIS = blurry (1 km) but daily.</div>`},
{t:"Urbanisation drives UHI", h:`
<p>Rapid population growth and <b>unregulated</b> expansion lead to:</p>
<ul><li><b>loss of vegetation</b></li><li>more <b>impervious surfaces</b></li></ul>
<p>Both raise temperatures, often within just a few decades.</p>
<div class="tw"><table>
<tr><th>City</th><th>What happened</th></tr>
<tr class="hl"><td><b>Jakarta</b></td><td><b>50%</b> loss of green areas (2000–2012) → <b>+3.2 °C</b></td></tr>
<tr><td>Lagos, Rio de Janeiro</td><td>Similar trends</td></tr>
<tr><td>Accra &amp; Kumasi (Ghana)</td><td>Higher LST from urban sprawl</td></tr>
<tr class="hl"><td><b>Bhubaneswar vs Cuttack</b> (India twin cities)</td><td>Bhubaneswar kept local cooling through vegetation. Cuttack had stronger UHI from denser urbanisation.</td></tr>
<tr><td>Tainan (Taiwan)</td><td>Land conversion 2007–2021 → +1.1 °C LST</td></tr>
<tr><td>Lagos, Ibadan, Umuahia (Nigeria)</td><td>Day and night UHI rose with expansion</td></tr>
<tr><td>Kota Kinabalu (Malaysia)</td><td>UHI rose 1991–2018</td></tr>
<tr><td>San Salvador</td><td>+0.5 °C SUHI (2000–2015)</td></tr>
<tr><td>Mérida (Mexico)</td><td>Up to +3.94 °C from vegetation loss</td></tr>
<tr><td>Kolkata</td><td>A 20-year study linked vegetation loss to stronger UHI</td></tr>
</table></div>`},
{t:"The Kampala exception, and Africa", h:`
<p><b>Kampala (Uganda)</b> is the hopeful case:</p>
<ul>
<li>Urban land cover <b>doubled</b> from 1995 to 2016.</li>
<li>Yet SUHI intensity <b>fell</b> from <b>2.2 °C to 1.9 °C</b> by 2017.</li>
<li>Reason: <b>green spaces were integrated</b> into the city.</li>
</ul>
<div class="key">Growth doesn't automatically mean a worse UHI. Planning with green space can offset it.</div>
<p><b>Africa-wide:</b> satellite analysis showed a <b>sharp increase in night-time heatwaves</b> over 1981–2020. Urbanisation was a key contributor.</p>`},
{t:"Urbanisation studies compared (Table 2)", h:`
<div class="tw"><table>
<tr><th>City / Köppen</th><th>Period</th><th>Change</th><th class="r">ΔLST / UHI</th></tr>
<tr><td>Ibadan, Nigeria / Aw</td><td>1984–2019</td><td>+179 km² urban</td><td class="r"><b>+21 °C</b></td></tr>
<tr><td>Kerala, India / Am</td><td>1988–2018</td><td>+21% built-up</td><td class="r">+7 °C</td></tr>
<tr><td>Osogbo, Nigeria / Aw</td><td>1986–2015</td><td>+51% impervious</td><td class="r">+4.6 °C</td></tr>
<tr><td>Umuahia, Nigeria / Am</td><td>1986–2017</td><td>−60% vegetation</td><td class="r">+4.5 °C</td></tr>
<tr><td>Mérida, Mexico / Aw</td><td>2000–2018</td><td>−5413 ha vegetation</td><td class="r">+2.36–3.94 °C</td></tr>
<tr><td>Lagos, Nigeria / Am (14.8 M people)</td><td>1984–2016</td><td>+310 km² built-up</td><td class="r">+2.3 °C SUHI</td></tr>
<tr><td>Kandy, Sri Lanka / Af</td><td>1996–2017</td><td>less veg, more impervious</td><td class="r">+2.3 °C</td></tr>
<tr><td>Kumasi, Ghana / Aw</td><td>2002–2017</td><td>Urban expansion</td><td class="r">+2.0 °C</td></tr>
<tr><td>Bhubaneswar-Cuttack / Aw</td><td>2001–2020</td><td>Urban expansion (MODIS)</td><td class="r">+0.75 °C SUHI</td></tr>
<tr><td>San Salvador / Aw</td><td>2000–2015</td><td>Urban expansion</td><td class="r">+0.5 °C SUHI</td></tr>
</table></div>
<p>All of these except Bhubaneswar-Cuttack (MODIS) used <b>Landsat</b>.</p>`},
{t:"Careful when comparing cities", h:`
<p>Comparing, say, Bhubaneswar with Lagos is risky. The cities differ in:</p>
<ul>
<li>population size</li>
<li>socio-economic development</li>
<li>urban morphology</li>
<li>climate</li>
</ul>
<p>Also, each study defines "<b>urban</b>" and "<b>rural</b>" in its own way, which can <b>distort</b> UHI estimates.</p>
<p><b>Fix:</b> use <b>standard</b> land-cover classes and metrics, such as the <b>Local Climate Zones (LCZ)</b> framework.</p>
<p><b>LCZ</b> is a standard way to label any patch of a city by type, for example "compact high-rise" or "sparsely built". Studies using it can be compared fairly.</p>`},
{t:"Vegetation cools", h:`
<p>In the tropics, vegetation moderates UHI in three ways:</p>
<ol><li>It provides <b>shade</b>.</li><li>It increases <b>evapotranspiration</b>.</li><li>It <b>reduces surface temperatures</b>.</li></ol>
<p><b>NDVI</b> (Normalized Difference Vegetation Index) is a satellite measure of how green an area is.</p>
<ul>
<li><b>São Paulo and Rio:</b> NDVI analysis shows green areas are clearly cooler.</li>
<li><b>Bangkok:</b> tree planting is recommended to offset vegetation loss.</li>
<li><b>Ho Chi Minh City:</b> urban parks reduce LST and heat stress.</li>
<li><b>Indonesia:</b> green infrastructure counteracts rising temperatures.</li>
<li><b>Kerala:</b> LST rose from <b>26.5 °C to 28.1 °C</b> (1988–2019), linked to loss of green cover.</li>
<li><b>Chennai, Dhaka, Kolkata:</b> <b>large parks</b> and <b>high-albedo surfaces</b> were especially effective.</li>
</ul>`},
{t:"But vegetation isn't always good", h:`
<p>In <b>hot-humid</b> climates, too much or poorly planned vegetation can make <b>nights worse</b>:</p>
<ul>
<li>Dense canopies <b>block radiative heat loss</b> to the night sky, trapping heat below.</li>
<li>They add <b>moisture</b> to air that is already humid.</li>
</ul>
<p><b>Standalone trees</b> may have a <b>limited</b> effect on air temperature, given tropical high humidity and low wind.</p>
<p>So greening must be <b>climate-sensitive</b>. Planners should consider:</p>
<ul>
<li>vegetation type and spatial layout</li>
<li>humidity and cloud cover</li>
<li>night-time cooling needs</li>
</ul>
<h3>Tropical challenges for keeping greenery</h3>
<ul>
<li>High population growth and <b>land pressure</b></li>
<li><b>Deforestation</b> for urban expansion</li>
<li><b>Year-round heat</b>, so continuous green cover matters even more than in temperate cities</li>
</ul>`},
{t:"Seasons change the UHI", h:`
<p>In the tropics, three seasonal factors shape UHI:</p>
<ul><li><b>rainfall</b></li><li><b>atmospheric moisture</b></li><li><b>vegetation cycles</b></li></ul>
<div class="vs">
<div><h3>Peaks in the DRY season</h3><ul><li><b>Lagos:</b> night UHI peaks in the dry season. The paper links this to <b>lower humidity</b> and <b>lower evapotranspiration</b>. Dry air and dry ground let the countryside cool fast at night, while the city's concrete keeps releasing stored heat.</li><li><b>Horn of Africa:</b> drought and vegetation loss amplify overheating.</li><li>Rayong (Thailand) and Kerala: wet/dry vegetation changes drive the pattern.</li></ul></div>
<div><h3>Peaks in the RAINY season</h3><ul><li><b>Presidente Prudente:</b> surface UHI peaks in the rainy season, through cloud, rain and material properties.</li><li>Another Brazilian city: highest in the <b>hot, rainy summer</b>.</li><li><b>1449 Chinese cities:</b> humid tropical and subtropical cities have the most intense SUHI in the <b>rainy</b> season. <b>Arid</b> zones show weaker effects (little evapotranspiration).</li></ul></div>
</div>
<p><b>Other cases:</b></p>
<ul>
<li><b>San Salvador:</b> a 16 °C LST amplitude during mid-morning warming.</li>
<li><b>Bangkok:</b> patterns shift with land use and the monsoon.</li>
<li><b>Mughal et al.:</b> <b>sea surface temperature</b> changes coastal city climate in wet and dry seasons.</li>
</ul>`},
{t:"Tropical vs temperate: Presidente Prudente vs Rennes", h:`
<p>This study compared medium-sized cities: Presidente Prudente (Brazil, tropical) and Rennes (France, temperate).</p>
<div class="vs">
<div><h3>Temperate (Rennes)</h3><p>Bigger <b>daily</b> temperature swings.</p></div>
<div><h3>Tropical (Presidente Prudente)</h3><p>More <b>sustained heat retention</b>. Two causes: constant warmth and <b>reduced night-time ventilation</b>.</p></div>
</div>
<p>Vegetation reduced both air and surface temperatures, <b>especially at night</b>, when atmospheric heat islands are strongest.</p>
<div class="key">Policy needs to build <b>seasonal variability</b> into planning, for example tree-planting campaigns timed to regional climate patterns.</div>`},

["Compared with temperate Rennes, tropical Presidente Prudente showed…", ["Bigger daily swings","More sustained heat retention and reduced nocturnal ventilation","No UHI","UHI only in the day"], 1, "Tropical cities hold heat longer."]
]}
]},

/* ───────────────────────── 6. MODELLING I ───────────────────────── */
{t:"Computer models I: city scale", c:[
{t:"Why models, and the three families", h:`
<p><b>Models</b> simulate UHI on a computer. They let you test "what if?" scenarios, like adding trees or cool roofs, <b>before</b> spending money in the real world.</p>
<p>There are three families of tools:</p>
<ol>
<li><b>Thermal simulation tools</b> with urban canopy models, at city, neighbourhood or building scale.</li>
<li><b>Empirical / statistical</b> models, such as regression.</li>
<li><b>Machine learning</b>, which is still emerging.</li>
</ol>
<p><b>Most-used tools (Fig 8):</b></p>
${bars([["WRF",18],["Regression",15],["Envi-met",14],["AI",4],["Rayman",3]],18)}
<p>The text says <b>20</b> studies used WRF, while Fig 8 shows 18. Either way, <b>WRF is #1</b> and <b>Envi-met</b> is the top CFD tool.</p>
<p><b>Model scale matches study scale:</b></p>
<ul>
<li><b>City</b> → WRF</li>
<li><b>Neighbourhood</b> → Envi-met / CFD</li>
<li><b>Building</b> → Rayman, EnergyPlus</li>
</ul>`},
{t:"WRF: the city-scale workhorse", h:`
<p><b>WRF = Weather Research and Forecasting</b> model.</p>
<ul>
<li>It is the <b>most used</b> numerical tool in tropical UHI studies.</li>
<li>It was developed by <b>NCAR</b> (National Center for Atmospheric Research, USA).</li>
<li>It is used in research <b>and</b> in real weather forecasting.</li>
<li>It simulates <b>temperature, wind, humidity, precipitation</b>.</li>
<li>It runs at resolutions from about <b>1 km down to a few hundred metres</b>, which suits <b>mesoscale</b> (city/region) simulation.</li>
</ul>
<h3>Plug-ins that make WRF "urban"</h3>
<p>WRF is coupled with an <b>Urban Canopy Model (UCM)</b>, which represents how buildings interact with the air. According to Zhu &amp; Ooka, three UCMs are built into WRF:</p>
<ol>
<li><b>SLUCM</b>: Single-Layer Urban Canopy Model</li>
<li><b>MLUCM</b>: Multi-Layer UCM, also called <b>BEP</b> (Building Effect Parameterization)</li>
<li><b>BEP + BEM</b>: BEP plus a <b>Building Energy Model</b></li>
</ol>
<p>Coupling with the <b>Noah Land Surface Model</b> adds <b>vegetation, hydrology and artificial materials</b>.</p>
<div class="key">WRF (NCAR) + UCM (SLUCM / BEP / BEP+BEM) + Noah LSM.</div>`},
{t:"WRF findings: urbanisation", h:`
<p>Tropical cities often expand in an <b>unplanned</b> way, changing how land and atmosphere interact. WRF studies show:</p>
<ul>
<li><b>Ho Chi Minh City and Malaysia:</b> a patchy land-use mix (<b>heterogeneity</b>) changes the height of the <b>planetary boundary layer</b> and the <b>sensible heat flux</b>.</li>
<li><b>Bhubaneswar and Chennai:</b> urbanisation alters <b>boundary-layer dynamics</b>, creating local heating and <b>disrupted wind patterns</b>.</li>
<li><b>Kolkata (Rath et al.):</b> urbanisation boosts boundary-layer growth, local <b>convection</b>, <b>night-time UHI</b>, and changes <b>rainfall</b> patterns.</li>
</ul>
<p><b>Boundary layer:</b> the lowest part of the atmosphere, roughly the bottom 1–2 km, which "feels" the ground. Cities heat and stir it.</p>
<div class="key">Urbanisation-induced surface <b>heterogeneity amplifies UHI</b>. Expansion is a significant risk factor.</div>`},
{t:"WRF findings: heat stress and extremes", h:`
<ul>
<li><b>Lagos:</b> high-resolution WRF showed big spatial differences in <b>heat stress</b>, from the combined effect of urban expansion and climate change.</li>
<li><b>Tropical Andes:</b> WRF coupled with <b>chemical transport</b> models assessed <b>air pollution</b> effects on urban microclimate.</li>
<li><b>Chew et al. (Singapore):</b> studied the <b>UHI–heatwave interaction</b>. Tropical cities facing severe future heat stress need more study.</li>
</ul>
<p>WRF studies of heat stress and extreme weather are <b>understudied in the tropics</b> compared with temperate regions.</p>
<p>WRF has been <b>validated</b> against in situ observations in <b>Southeast Asia</b> (Doan, Ho Chi Minh City), so it is reliable for adaptation planning.</p>`},
{t:"WRF findings: mitigation", h:`
<ul>
<li><b>More vegetation</b> and <b>cool roofs</b> → <b>reduce</b> UHI intensity.</li>
<li><b>Anthropogenic emissions</b> (waste heat) → <b>worsen</b> urban heating.</li>
<li>Sensitivity analyses of WRF's physics settings helped optimise <b>reflective coatings</b>.</li>
<li><b>Singh et al., Angul-Talcher (India):</b> an <b>industrial</b> heat island. The best mix was <b>cool roofs + water bodies + mixed forest patches</b>. They stressed the need to combine science, economics and policy.</li>
</ul>
<div class="tip">Angul-Talcher = industrial heat island = cool roofs + water + mixed forest combined.</div>`},
{t:"Other city-scale models", h:`
<h3>UWG: Urban Weather Generator</h3>
<ul>
<li><b>Litardo et al., Duran (Ecuador):</b> used clustering and sensitivity analysis.</li>
<li>The key drivers were <b>informal settlements</b> with high anthropogenic heat.</li>
<li>The model was validated against in situ measurements.</li>
<li>They used <b>TRNSYS v.17</b> to estimate building cooling demand. UHI raised cooling energy by:
<ul>
<li><b>30–70%</b> in <b>residential</b> buildings</li>
<li><b>10–20%</b> in <b>commercial</b> buildings</li>
</ul></li>
</ul>
<h3>ADMS-Urban</h3>
<ul>
<li><b>Aktas et al., Kuala Lumpur:</b> thermal comfort and building energy use across <b>land-use types</b>.</li>
<li>It captures the role of <b>humidity</b> in how heat is perceived.</li>
<li>It also integrates land use and <b>pollution</b>.</li>
</ul>
<h3>t-TEB: tropical Town Energy Budget</h3>
<ul>
<li>Built by <b>Karam et al.</b> as a tropical extension of <b>TEB</b> (Masson).</li>
<li>It handles <b>free convection</b>, which is strong in the tropics and gives more intense heat diffusion.</li>
<li>It includes <b>limited urban drainage</b>: water pooling on roads after downpours.</li>
<li>It was tested on <b>Rio de Janeiro (2007)</b>, with results within <b>one standard deviation</b> of observed hourly averages.</li>
</ul>`},
{t:"Linking scales", h:`
<p>Some studies chain a city model with a street-level model. They couple <b>WRF</b> with microclimate tools such as <b>Envi-met</b> or <b>PALM-4U</b>.</p>
<ul>
<li><b>Wai et al.:</b> tested <b>water spraying</b> to cool <b>high-density Hong Kong</b> under projected <b>2050</b> tropical conditions.</li>
<li>This shows the value of <b>multi-scale</b> modelling for tailored adaptation.</li>
</ul>
<div class="key">WRF gives the city-wide weather. The micro model zooms in on streets. Together they test detailed interventions.</div>`},
{t:"Quiz: Models I", q:[
["Which numerical tool is used most in tropical UHI studies?", ["Envi-met","Rayman","WRF","EnergyPlus"], 2, "WRF (20 studies in the text; 18 in Fig 8)."],
["WRF was originally developed by…", ["NASA","NCAR","IPCC","ESA"], 1, "The National Center for Atmospheric Research."],
["Which is NOT one of the three urban canopy models integrated in WRF?", ["SLUCM","BEP (MLUCM)","BEP + BEM","STEVE"], 3, "STEVE is a separate empirical neighbourhood model from Singapore."],
["Coupling WRF with the Noah Land Surface Model mainly adds…", ["Air pollution chemistry","Vegetation, hydrology and artificial-material effects","Building interiors","Traffic flows"], 1, "Noah LSM handles land-surface and ecological processes."],
["UWG simulations in Duran, Ecuador showed UHI raised residential cooling energy by…", ["5–10%","10–20%","30–70%","Over 100%"], 2, "30–70% residential; 10–20% commercial."],
["t-TEB is special because it…", ["Is a satellite","Accounts for tropical free convection and limited urban drainage","Is a machine-learning model","Only works in deserts"], 1, "A tropical extension of TEB, tested on Rio (2007)."],
["Singh et al. found the best mitigation for the Angul-Talcher industrial heat island was…", ["Cool roofs alone","Cool roofs + water bodies + mixed forest patches","Electric vehicles","Green walls only"], 1, "A combined strategy."],
["Rath et al. found that urbanisation over Kolkata…", ["Reduced rainfall only","Boosted boundary-layer development, convection and night-time UHI, and altered rainfall","Had no effect","Cooled the city"], 1, "Seen in WRF simulations of pre-monsoon thunderstorms."],
["Wai et al. coupled WRF with micro-scale tools to test…", ["Green roofs in Lagos","Water spraying in Hong Kong under 2050 conditions","Cool pavements in Singapore","EVs in Bangkok"], 1, "Water spraying in high-density Hong Kong."]
]}
]},

/* ───────────────────────── 7. MODELLING II ───────────────────────── */
{t:"Computer models II: street to building", c:[
{t:"Neighbourhood scale: CFD and Envi-met", h:`
<p>At neighbourhood scale, the key question is how <b>urban form</b> affects heat. Changing building <b>heights and spacing</b> changes airflow and comfort.</p>
<p><b>CFD = Computational Fluid Dynamics</b>: simulating how air flows around buildings.</p>
<h3>Envi-met: the most popular CFD tool (14 studies)</h3>
<ul>
<li>Developed by <b>Bruse &amp; Fleer</b>.</li>
<li><b>3-D</b>, <b>dynamic</b> (changes over time).</li>
<li>Simulates <b>buildings–vegetation–atmosphere</b> interactions in <b>urban canyons</b> (streets lined with buildings).</li>
<li>Based on the <b>Navier–Stokes</b> equations with a <b>first-order turbulence</b> model.</li>
</ul>
<h3>Envi-met studies</h3>
<ul>
<li><b>Huang &amp; Chen, Kaohsiung (Taiwan):</b> mitigation strategies.</li>
<li><b>Shahidan et al. (Malaysia):</b> tree placement + ground materials.</li>
<li><b>Herath et al., Colombo:</b> green infrastructure, <b>validated</b> with field data.</li>
<li><b>Swamy et al., Chennai:</b> air pollution + UHI. <b>Low tropical wind speeds (0.2–5 m/s)</b> worsen UHI by reducing convective cooling.</li>
</ul>`},
{t:"Kotharkar et al., Nagpur: four lessons", h:`
<p>An Envi-met test of solutions in Nagpur, India:</p>
<ol>
<li><b>Cool roofs</b> work better in <b>high-density</b> areas than in sparse settlements.</li>
<li><b>Greening</b> is very beneficial for cooling and comfort at <b>pedestrian level</b>.</li>
<li>Trees <b>spread along streets</b> beat the same amount of trees concentrated in one green area.</li>
<li>A <b>Green Area Ratio (GAR) of 25%</b> suits an <b>LCZ 9</b> area, giving up to <b>2.7 °C daytime cooling</b>.</li>
</ol>
<p><b>LCZ 9</b> is a sparsely built settlement. In Nagpur these areas are developing into <b>LCZ 3</b> (compact low-rise).</p>
<div class="key">Which intervention works best depends on the neighbourhood's density and built form.</div>`},
{t:"Envi-met and comfort indices", h:`
<p>Envi-met can compute <b>outdoor thermal comfort</b>. It includes personal factors such as <b>metabolic rate</b> and <b>clothing insulation</b>, plus humidity and sun.</p>
<ul>
<li><b>UTCI:</b> Raya et al., <b>Jakarta transit-oriented development (TOD)</b> areas.</li>
<li><b>PET:</b> used widely, including for <b>biomimicry</b>-based urban designs (designs copying nature).</li>
<li><b>MRT + PET:</b> Arif &amp; Yola.</li>
<li><b>PET:</b> Chatterjee et al., Acero et al.</li>
</ul>`},
{t:"STEVE vs Envi-met", h:`
<p><b>STEVE</b> is an <b>empirical</b> model built from <b>tropical data from Singapore</b>.</p>
<ul>
<li>It calculates <b>maximum, minimum and average air temperature</b> within a <b>50 m radius</b>.</li>
<li>It accounts for constant heat, humidity and tropical urban forms.</li>
<li><b>Ignatius et al.:</b> used it to study how <b>urban texture</b> (density, building form) affects heat gain, ventilation and comfort in Singapore.</li>
</ul>
<h3>Head-to-head (Wong et al.)</h3>
<div class="vs">
<div><h3>Envi-met</h3><p>Built mainly for <b>temperate</b> climates. On empty land it <b>under-predicted temperatures by 2–3 °C</b>, because of its "ideal conditions" assumptions.</p></div>
<div><h3>STEVE</h3><p>Calibrated on tropical data. It predicted <b>higher, more realistic</b> temperatures.</p></div>
</div>
<div class="key">Lesson: use models <b>designed for tropical climates</b>.</div>`},
{t:"Other CFD tools", h:`
<div class="tw"><table>
<tr><th>Tool</th><th>Study</th><th>Finding</th></tr>
<tr><td><b>ANSYS Fluent</b></td><td>Adelia et al., Singapore</td><td>How <b>high-rise residential</b> buildings shed waste heat. The <b>position of heat sources</b> and <b>building porosity</b> (gaps for air) control heat removal from narrow streets.</td></tr>
<tr><td><b>OpenFOAM</b></td><td>Mughal et al.</td><td>UTCI and vegetation. In the tropics, vegetation can <b>raise humidity</b> and <b>reduce</b> already-low <b>wind</b>, both bad for comfort.</td></tr>
<tr><td><b>CRADLE (scSTREAM)</b></td><td>Ill Kim, Singapore</td><td>Optimised <b>office building forms</b> for <b>natural ventilation</b>: better comfort and energy efficiency.</td></tr>
</table></div>
<h3>A common weakness of CFD</h3>
<ul>
<li>Most CFD studies assume <b>steady-state inflow</b>: constant wind coming in.</li>
<li>Real tropical wind has <b>gusts, turbulence and shifts</b>.</li>
<li><b>Zhang et al.</b> developed <b>time-varying inflow</b> methods, which give more realistic airflow in street canyons.</li>
</ul>`},
{t:"Building scale: Rayman", h:`
<p><b>Rayman</b> models <b>radiation</b> exchange at the level of a person or building. It is good at calculating <b>MRT</b>, which matters because the tropical sun is the main cause of discomfort.</p>
<ul>
<li><b>Cuba (Camagüey courtyards):</b>
<ul>
<li>Courtyards with an <b>aspect ratio between 1 and 3</b> improved ventilation and limited solar heat.</li>
<li>Avoiding <b>East–West</b> orientations cut MRT by up to <b>15.7 °C</b>.</li>
</ul></li>
<li><b>Fung &amp; Jim, Hong Kong:</b> PET. <b>Tree configurations</b> give crucial shade.</li>
<li><b>Simath &amp; Emmanuel, Colombo:</b> combine <b>natural ventilation</b> with strategic <b>vegetation</b>.</li>
<li><b>Arif &amp; Yola, Jakarta:</b> reducing <b>Sky View Factor (SVF)</b> to increase shading lowers MRT and PET.</li>
</ul>
<p><b>Aspect ratio</b> = height of the surrounding walls ÷ width of the open space.</p>
<p><b>Sky View Factor</b> = how much sky is visible from a point. Lower SVF means more shade by day.</p>`},
{t:"Building scale: DART and EnergyPlus", h:`
<h3>DART (Discrete Anisotropic Radiative Transfer)</h3>
<ul>
<li><b>Dissegna et al., Singapore:</b> rebuilt a <b>3-D</b> urban landscape.</li>
<li>They showed how <b>leaf area density</b> changes the radiation absorbed by surfaces.</li>
<li>The results were <b>validated</b> with field measurements.</li>
</ul>
<h3>EnergyPlus (building energy simulation)</h3>
<ul>
<li><b>Yang et al., Singapore</b>, compared green and cool roofs:
<ul>
<li><b>Green roofs</b> help, but frequent rain and <b>high moisture</b> affect their performance.</li>
<li><b>Cool roofs</b> had <b>higher</b> mitigation potential. They reflect sunlight <b>without adding latent heat</b> (moisture) from evapotranspiration.</li>
<li>So cool roofs suit <b>Singapore</b> better.</li>
</ul></li>
<li><b>Koranteng et al., Ghana:</b> green roofs are thermally efficient (−1.5 °C indoors). A <b>larger leaf area index</b> and <b>deeper soil</b> cool more.</li>
</ul>
<div class="tip">This contrasts with Chatterjee in the intro (vegetation beats cool roofs). The answer depends on context. In very humid Singapore, cool roofs won in the EnergyPlus study.</div>`},
{t:"The indoor–outdoor gap", h:`
<ul>
<li>Envi-met is widely used for <b>outdoor</b> microclimate.</li>
<li>It is <b>rarely coupled</b> with building energy tools to study <b>indoor–outdoor</b> interactions.</li>
<li>This coupling matters because outdoor heat drives <b>indoor cooling energy</b> demand.</li>
</ul>
<p><b>Solutions that exist:</b></p>
<ul>
<li><b>Lauzet et al.:</b> a <b>chaining</b> method that feeds <b>Envi-met outputs into EnergyPlus</b>.</li>
<li><b>PALM-4U:</b> combines urban canopy, building energy and atmospheric dynamics in <b>one framework</b>.</li>
</ul>
<p>These hybrid frameworks are <b>underexplored</b> in tropical studies, and future research should use them.</p>`},
{t:"Empirical and statistical models", h:`
<p>These use <b>observed data</b> and statistics (mainly <b>regression</b>) to link urban features to temperature. They are <b>cheap and adaptable</b>.</p>
<div class="tw"><table>
<tr><th>Where</th><th>Study</th><th>What</th></tr>
<tr><td>Singapore</td><td>Richards et al.</td><td>Cooling by different <b>vegetation types</b></td></tr>
<tr><td>Singapore</td><td>Jin et al.</td><td>Building <b>density and height</b> → microclimate</td></tr>
<tr><td>Singapore</td><td>Yu et al.</td><td>Morphology vs air temperature over time (a <b>campus</b>)</td></tr>
<tr><td>Kolkata</td><td>Khan &amp; Chatterjee</td><td><b>25 field sites</b> + simulation, urban vs suburban</td></tr>
<tr><td>India</td><td>Das et al.</td><td>Cooling by urban <b>green spaces</b> (correlation + regression)</td></tr>
<tr><td>Indian cities</td><td>Mohammad &amp; Goswami</td><td><b>Multiple linear regression</b>: daily and seasonal SUHI drivers</td></tr>
<tr><td>Mérida, Mexico</td><td>Palafox-Juárez et al.</td><td>Regression of LST vs <b>NDVI</b></td></tr>
<tr><td>Kampala</td><td>Kabano et al.</td><td>Temperature, humidity, heat index across the <b>wet–dry transition</b></td></tr>
</table></div>`},
{t:"Machine learning", h:`
<p>Machine learning is still <b>emerging</b>: only <b>4 studies</b> used it.</p>
<div class="tw"><table>
<tr><th>Study</th><th>Where</th><th>Method</th></tr>
<tr><td>Mohite &amp; Surawar</td><td>Nagpur</td><td><b>Random Forest</b> to predict thermal comfort (with Rayman)</td></tr>
<tr><td>Jia et al.</td><td>Hong Kong &amp; Singapore</td><td><b>Geographically Weighted Regression + Deep Neural Networks</b>: green infrastructure cooling</td></tr>
<tr><td>Zhou et al.</td><td>Sanya, China</td><td><b>Genetic Algorithm</b> to optimise <b>green space layout</b></td></tr>
<tr><td>Garzón et al.</td><td>A Colombian city</td><td>Remote sensing + ML to model <b>SUHI</b></td></tr>
</table></div>
<p>ML <b>complements</b> simulation and statistics.</p>`},
{t:"From simulation to real projects", h:`
<p>Models aren't only for understanding physics. They are <b>decision-support tools</b>.</p>
<ul>
<li>Envi-met, WRF-UCMs and EnergyPlus are often used to test <b>vegetation, cool roofs and design changes</b> before building anything.</li>
<li>Planners can foresee cooling effects and judge <b>cost-effectiveness, scalability and limits</b>.</li>
<li>Outputs such as temperature drops or comfort index changes turn ideas into <b>evidence-based</b> plans.</li>
</ul>
<div class="key">In tropical cities, urbanisation often <b>outpaces</b> adaptation. Testing solutions virtually is a crucial asset.</div>`},
{t:"All tools at a glance (Table 6)", h:`
<div class="tw"><table>
<tr><th>Tool</th><th>Scale</th><th>Strength in the tropics</th></tr>
<tr><td><b>WRF + UCMs</b></td><td>City / region</td><td>Mesoscale and seasonal dynamics; validated in SE Asia; sensitive to land use and AH</td></tr>
<tr><td><b>UWG</b></td><td>City / neighbourhood</td><td>High AH in informal settlements; building energy</td></tr>
<tr><td><b>ADMS-Urban</b></td><td>City / neighbourhood</td><td>Humidity and low ventilation; includes land use and pollution</td></tr>
<tr><td><b>t-TEB</b></td><td>City</td><td>Tropical convection, rainfall, poor drainage</td></tr>
<tr><td><b>Envi-met</b></td><td>Neighbourhood</td><td>Most popular CFD; greening, tree shade, ventilation; MRT/PET/UTCI</td></tr>
<tr><td><b>STEVE</b></td><td>Neighbourhood</td><td>Empirical, tropical data; beats temperate tools</td></tr>
<tr><td><b>ANSYS Fluent, OpenFOAM, CRADLE</b></td><td>Neighbourhood / building</td><td>Flexible CFD; building porosity</td></tr>
<tr><td><b>Rayman</b></td><td>Building / individual</td><td>Solar radiation, MRT, PET; courtyards, shading</td></tr>
<tr><td><b>EnergyPlus</b></td><td>Building</td><td>Cooling load; green and cool roofs; indoor–outdoor coupling</td></tr>
<tr><td><b>DART</b></td><td>Building / urban patch</td><td>3-D radiation transfer with vegetation</td></tr>
</table></div>`},

/* ───────────────────────── 8. SOLUTIONS ───────────────────────── */
{t:"Solutions", c:[
{t:"Four families of solutions", h:`
<p><b>43</b> of the papers test mitigation solutions. Most work at the <b>microscale</b>: buildings or streets.</p>
<div class="tw"><table>
<tr><th>Family</th><th>What</th></tr>
<tr><td><b>Green</b></td><td>Vegetation: trees, parks, green roofs, green walls</td></tr>
<tr><td><b>Blue</b></td><td>Water: lakes, fountains, wetlands</td></tr>
<tr><td><b>Gray</b></td><td>Technology and structure: high-albedo materials, cool pavements, reflective paints, better urban morphology</td></tr>
<tr><td><b>Reducing anthropogenic heat (AH)</b></td><td>Public transport, electric mobility, building insulation, optimised AC use</td></tr>
</table></div>
<div class="key">Green + Blue = <b>Nature-Based Solutions (NBS)</b>. They use ecological processes.</div>`},
{t:"Green: why it works, and its limits", h:`
<p>In the tropics, vegetation is <b>active all year</b>, especially in <b>Af</b> zones, where dense foliage gives constant shade.</p>
<p><b>Two cooling mechanisms:</b></p>
<ol>
<li>Less solar radiation is absorbed by surfaces (<b>shade</b>).</li>
<li>Cooling by <b>evapotranspiration</b>.</li>
</ol>
<p><b>Limit:</b> in <b>extreme heat or drought</b>, plants close their <b>stomata</b> (leaf pores) to save water. Transpiration stops, so cooling drops.</p>
<p><b>Plus side:</b> heavy rain and humidity make greenery easy to maintain, so it is <b>sustainable and relatively low-cost</b>.</p>
<p><b>Acero et al.:</b> <b>rain events</b> change air temperature and humidity in parks, altering their cooling benefit.</p>`},
{t:"Green: roofs, walls, trees, parks", h:`
<h3>On buildings</h3>
<ul>
<li><b>Green roofs</b> can significantly cut surface and air temperatures. They are widely studied in tropical cities.</li>
<li><b>Vertical greening systems (VGS)</b> in Sri Lanka lower surface temperatures (Rupasinghe &amp; Halwatura).</li>
<li><b>Living walls</b> in the Dominican Republic cool too (Ruiz-Valero et al.).</li>
<li><b>Caution:</b> in very humid climates, <b>plant maintenance</b> and <b>structural durability</b> are challenges.</li>
</ul>
<h3>In the city</h3>
<ul>
<li><b>Richards &amp; Edwards, Singapore:</b> measured street-tree cooling using <b>Google Street View</b>.</li>
<li><b>Acero et al.:</b> <b>species choice</b> matters; leaf <b>transmissivity</b> and <b>diffuse radiation</b> affect cooling.</li>
<li><b>Tan et al.:</b> compared plant species for UHI mitigation.</li>
<li><b>Li et al.:</b> optimal green-space layouts in <b>Dhaka, Kolkata, Bangkok</b>.</li>
<li><b>Silveira et al.:</b> <b>private gardens</b> matter (Rio).</li>
<li><b>Anak Kemarau:</b> more green space correlates with lower LST (Malaysia).</li>
</ul>`},
{t:"Green: design ideas", h:`
<ul>
<li><b>"Shadow umbrella" (Emmanuel):</b> tree canopies and green structures form a continuous shade cover in <b>high-density</b> tropical cities.</li>
<li><b>Harun et al., Kuala Lumpur:</b> vegetation <b>patches</b> cool through <b>shading + evapotranspiration</b>.</li>
<li><b>Standalone trees:</b> recent measurements suggest a <b>minimal</b> temperature effect in tropical weather.</li>
<li><b>Agrihood (Irvine et al., Bangkok):</b> combines urban greenery with <b>food production</b> and ecosystem services, for cooling and <b>biodiversity</b>.</li>
</ul>`},
{t:"Green solutions compared (Table 3)", h:`
<div class="tw"><table>
<tr><th>Study</th><th>Where</th><th>Solution</th><th>Effect</th></tr>
<tr><td>Koranteng</td><td>Kumasi / Aw</td><td>Green roofs (EnergyPlus)</td><td>−1.5 °C indoor. Bigger LAI + deeper soil helps</td></tr>
<tr><td>Pragati</td><td>Chennai / As</td><td>Green roofs + walls</td><td>−10.5% energy; −13% cooling demand</td></tr>
<tr class="hl"><td>Rupasinghe &amp; Halwatura</td><td>Moratuwa / Af</td><td>Vertical greening</td><td><b>−10.16 °C surface</b>, −2.11 °C indoor</td></tr>
<tr><td>Ruiz-Valero</td><td>Santo Domingo / Aw</td><td>Living wall</td><td>−5.3 °C air</td></tr>
<tr><td>Richards</td><td>Singapore / Af</td><td>Trees, shrubs</td><td><b>Secondary forest</b> cools air best</td></tr>
<tr class="hl"><td>Tan</td><td>Singapore / Af</td><td>Turf, shrubs, climbers (rooftop)</td><td><b>−11 °C</b> vs artificial materials. <b>Shade</b> is key</td></tr>
<tr class="hl"><td>Li</td><td>Dhaka, Kolkata, Bangkok</td><td>Urban green space (MODIS)</td><td>−4.83 to −8.07 °C. <b>Optimal park size 0.37–0.77 ha</b></td></tr>
<tr><td>Harun</td><td>Kuala Lumpur / Af</td><td>Vegetation + water</td><td>−6 °C night, −4 °C day. Combined is best at night</td></tr>
<tr><td>Silveira; Irvine</td><td>Rio; Bangkok</td><td>Gardens; Agrihood</td><td>Not quantified</td></tr>
</table></div>
<p>Some green solutions cut <b>surface</b> temperature by <b>more than 10 °C</b>, especially when vegetation is dense, well placed and well maintained. Results vary with plant traits and microclimate.</p>`},
{t:"Green in the drier tropics", h:`
<p>In <b>Aw and As</b> climates, long <b>dry seasons</b> mean plants may not survive without <b>irrigation</b>.</p>
<ul>
<li><b>Vertical greenery systems</b> struggle in extreme tropical weather (Senalankadhikara; Acero).</li>
<li>Success needs careful <b>material choice</b>, interdisciplinary <b>maintenance</b>, and ongoing technical adaptation.</li>
</ul>
<div class="key">In dry tropics, <b>blue</b> and <b>gray</b> solutions may be needed alongside green ones.</div>`},
{t:"Blue: water-based solutions", h:`
<p><b>How water cools:</b> evaporation converts <b>sensible heat into latent heat</b>. Energy goes into turning water into vapour instead of raising the temperature.</p>
<ul>
<li><b>Le Phuc et al., Hue:</b> urban <b>lakes</b> act as <b>cooling islands</b>.</li>
<li><b>Kemarau &amp; Eboy:</b> <b>wetlands</b> lower land surface temperature.</li>
</ul>
<h3>Green vs blue: Morris et al., Putrajaya "garden city"</h3>
<ul>
<li><b>Vegetation cooled more</b> than water bodies.</li>
<li>Water bodies caused <b>local warming</b> at certain times: <b>mornings and evenings</b>.</li>
<li>In already-humid tropical air, water's effect is nuanced.</li>
</ul>
<div class="tip">Water stores heat in the day and releases it later, and it adds humidity. So "blue" isn't always cool in the humid tropics.</div>`},
{t:"Gray: the principles", h:`
<p><b>Material-based</b> strategies aim at three things:</p>
<ol>
<li><b>Increase solar reflectance / albedo</b>: reflect sunlight.</li>
<li><b>Reduce thermal accumulation</b>: store less heat.</li>
<li><b>Enhance surface water evaporation</b>.</li>
</ol>
<p>They do this through "<b>cool</b>" or "<b>heat-reflective</b>" materials on <b>pavements, rooftops and façades</b>.</p>
<p><b>Why they matter in the tropics:</b> constant strong sun, high temperatures and humidity all year. So <b>passive cooling</b> (no energy needed) is essential.</p>
<p><b>Tropical requirement:</b> materials must be <b>durable</b> under intense sun, heavy rain and moisture.</p>`},
{t:"Gray: coatings, walls and pavements", h:`
<div class="tw"><table>
<tr><th>Study</th><th>Where</th><th>Solution</th><th>Effect</th></tr>
<tr><td>Anting et al.</td><td>Johor Bahru, Malaysia</td><td>Cool pavement from <b>waste tile aggregates</b></td><td>−6.4 °C (FBP tiles), −4.3 °C (PG)</td></tr>
<tr><td>Joseph et al.</td><td>Kuala Lumpur</td><td><b>Barium sulfate</b> and <b>calcium carbonate</b> paints</td><td><b>Subambient</b> cooling: the surface gets cooler than the air</td></tr>
<tr class="hl"><td>Malet-Damour et al.</td><td>(rooftops)</td><td><b>Nano-structured ceramic</b> coating</td><td>Surface <b>&gt;50 °C cooler</b>; heat flux cut by <b>&gt;70%</b></td></tr>
<tr><td>Donthu et al.</td><td>Singapore</td><td>Cool surfaces on a full-scale street canyon</td><td>−2 °C air, −1.5 °C UTCI</td></tr>
<tr><td>Wonorahardjo et al.</td><td>Bandung, Indonesia</td><td>Wall materials compared</td><td><b>Insulated sandwich walls</b> beat massive walls</td></tr>
<tr><td>Mintorogo &amp; Ahmad</td><td>Surabaya</td><td><b>Pakis-Stem Blocks</b> roofing</td><td>Passive cooling via <b>convective airflow</b> + eco-materials</td></tr>
<tr class="hl"><td>Senevirathne et al.</td><td>Moratuwa, Sri Lanka</td><td><b>27 pavement setups</b>, coloured and textured pavers</td><td><b>Gray/red</b> pavers 4.2–4.5 °C cooler than <b>black</b>. Smoother textures kept less heat. Red jagged pavers had the lowest temperature, <b>42.9 °C</b></td></tr>
</table></div>`},
{t:"Cutting anthropogenic heat", h:`
<p>Gray solutions <b>passively</b> block heat. The other approach is to cut waste heat at its <b>source</b>.</p>
<p><b>Main sources:</b></p>
<ul><li>building cooling (AC)</li><li>industry</li><li>especially <b>road transport</b></li></ul>
<p><b>Cars with AC create a dual burden:</b></p>
<ol>
<li>Waste heat goes straight into the street.</li>
<li>Electricity demand rises on the grid.</li>
</ol>
<ul>
<li><b>Singh et al., Singapore:</b> <b>road transport</b> and <b>power generation</b> significantly add to UHI.</li>
<li><b>Electric vehicles</b> release less waste heat, especially with clean electricity.</li>
<li><b>Mussetti et al., Singapore:</b> widespread EV adoption could <b>moderately</b> reduce temperatures, especially in <b>dense traffic corridors</b>.</li>
</ul>
<div class="key">EVs give a dual benefit: fewer greenhouse gases <b>and</b> less local heat. Cutting AH is an important but often overlooked part of UHI mitigation.</div>`},
